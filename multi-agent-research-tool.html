
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="color-scheme" content="dark" />
  <title>Research</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
/* Research — ink instrument
   Quiet craft + signature: serif display, signal teal, dossier sheet */
:root {
  --bg: #0b0d10;
  --bg-elev: #0f1217;
  --bg-sheet: #10141a;
  --surface: #151a21;
  --surface-2: #1a2029;
  --surface-3: #222933;

  --fg: #eceae4;
  --fg-2: #9aa3b2;
  --muted: #6b7382;
  --meta: #525a68;

  --border: #1e2530;
  --border-soft: #181e27;
  --border-strong: #2a3340;

  --signal: #3ecfbe;
  --signal-dim: color-mix(in oklab, var(--signal) 18%, transparent);
  --signal-ink: #0b0d10;

  --accent: #eceae4;
  --accent-on: #0b0d10;
  --accent-hover: #ffffff;
  --accent-active: #d4d2cb;

  --success: #3d9a6a;
  --warn: #c9a227;
  --danger: #d45454;
  --info: var(--signal);

  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Geist", "Geist Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Monaco, monospace;

  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 30px;
  --text-3xl: 40px;

  --leading-body: 1.55;
  --leading-tight: 1.05;
  --tracking-display: -0.02em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  --btn-sm-h: 28px;
  --btn-sm-px: 10px;
  --btn-sm-fs: var(--text-xs);
  --btn-sm-gap: 6px;
  --btn-sm-icon: 12px;

  --btn-md-h: 32px;
  --btn-md-px: 12px;
  --btn-md-fs: var(--text-sm);
  --btn-md-gap: 6px;
  --btn-md-icon: 14px;

  --btn-lg-h: 36px;
  --btn-lg-px: 14px;
  --btn-lg-fs: var(--text-sm);
  --btn-lg-gap: 8px;
  --btn-lg-icon: 14px;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px color-mix(in oklab, var(--signal) 55%, transparent);

  --motion-fast: 140ms;
  --motion-base: 220ms;
  --motion-panel: 480ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-panel: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  --sidebar-w: 272px;
  --topbar-h: 54px;
  --z-scrim: 25;
  --z-sidebar: 30;
  --z-drawer-backdrop: 40;
  --z-drawer: 50;
  --z-modal: 55;
  --z-toast: 80;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  line-height: var(--leading-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
img, svg { display: block; max-width: 100%; }
a {
  color: var(--fg);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-color: var(--border-strong);
}
a:hover { text-decoration-color: var(--muted); }
a.btn { color: inherit; text-decoration: none; }
a.btn:hover { text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; padding: 0; }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3, h4 {
  margin: 0;
  text-wrap: balance;
  font-weight: 500;
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
}
::selection {
  background: color-mix(in oklab, var(--signal) 32%, transparent);
  color: var(--fg);
}

* { scrollbar-width: thin; scrollbar-color: #2a3340 transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: #2a3340;
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: #3a4555; background-clip: content-box; }

/* ─── shell: left signal spine + quiet ink field ─────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  min-height: 640px;
  background:
    radial-gradient(1200px 600px at 12% -8%, color-mix(in oklab, var(--signal) 4%, transparent), transparent 55%),
    linear-gradient(180deg, #0e1218 0%, var(--bg) 28%, var(--bg) 100%);
  position: relative;
}
.app::before {
  content: "";
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  z-index: var(--z-drawer);
  background: linear-gradient(
    180deg,
    var(--signal) 0%,
    color-mix(in oklab, var(--signal) 35%, transparent) 42%,
    transparent 100%
  );
  pointer-events: none;
}
/* Fine instrument grain — unique feel without noise overlays */
.app::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
  mix-blend-mode: soft-light;
}

/* ─── sidebar ───────────────────────────────────────────────────── */
.sidebar {
  display: flex;
  flex-direction: column;
  background: color-mix(in oklab, var(--bg-elev) 88%, #000);
  border-right: 1px solid var(--border);
  min-width: 0;
  z-index: 2;
}
.sidebar-head {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-3) var(--space-3);
  border-bottom: 1px solid var(--border);
}
.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 28px;
  padding: 0 2px;
  margin-bottom: 2px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
  font-size: var(--text-sm);
  letter-spacing: -0.02em;
  color: var(--fg);
}
.brand-mark {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--fg);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  font-style: italic;
  line-height: 1;
  letter-spacing: 0;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 0 0 3px color-mix(in oklab, var(--signal) 12%, transparent);
}
.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1.1;
}
.brand-name {
  font-size: var(--text-sm);
  font-weight: 500;
  letter-spacing: -0.02em;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--meta);
}

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-weight: 500;
  letter-spacing: -0.01em;
  transition:
    background var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard),
    opacity var(--motion-fast) var(--ease-standard),
    transform var(--motion-fast) var(--ease-standard);
  white-space: nowrap;
  height: var(--btn-md-h);
  padding: 0 var(--btn-md-px);
  font-size: var(--btn-md-fs);
  gap: var(--btn-md-gap);
}
.btn svg {
  width: var(--btn-md-icon);
  height: var(--btn-md-icon);
  flex-shrink: 0;
}
.btn-sm {
  height: var(--btn-sm-h);
  padding: 0 var(--btn-sm-px);
  font-size: var(--btn-sm-fs);
  gap: var(--btn-sm-gap);
}
.btn-sm svg { width: var(--btn-sm-icon); height: var(--btn-sm-icon); }
.btn-md {
  height: var(--btn-md-h);
  padding: 0 var(--btn-md-px);
  font-size: var(--btn-md-fs);
  gap: var(--btn-md-gap);
}
.btn-md svg { width: var(--btn-md-icon); height: var(--btn-md-icon); }
.btn-lg {
  height: var(--btn-lg-h);
  padding: 0 var(--btn-lg-px);
  font-size: var(--btn-lg-fs);
  gap: var(--btn-lg-gap);
}
.btn-lg svg { width: var(--btn-lg-icon); height: var(--btn-lg-icon); }

.btn-primary {
  background: var(--accent);
  color: var(--accent-on);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active {
  background: var(--accent-active);
  transform: translateY(0.5px);
}

.btn-secondary {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover {
  background: var(--surface);
  border-color: #3a4555;
}

.btn-ghost {
  background: transparent;
  color: var(--fg-2);
}
.btn-ghost:hover {
  background: var(--surface);
  color: var(--fg);
}

.btn-danger-ghost { color: #e07a7a; }
.btn-danger-ghost:hover {
  background: rgba(212, 84, 84, 0.1);
  color: #f0a0a0;
}
.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover { background: color-mix(in oklab, var(--danger), white 8%); }
.btn-danger:active { background: color-mix(in oklab, var(--danger), black 10%); }

.btn-block { width: 100%; }
.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.field-search { position: relative; }
.field-search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--meta);
  pointer-events: none;
}
.field-search input {
  width: 100%;
  height: var(--btn-md-h);
  padding: 0 10px 0 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: var(--text-sm);
  color: var(--fg);
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.field-search input::placeholder { color: var(--meta); }
.field-search input:hover { border-color: var(--border-strong); }
.field-search input:focus-visible {
  border-color: color-mix(in oklab, var(--signal) 45%, var(--border-strong));
  background: var(--bg-elev);
  box-shadow: var(--focus-ring);
  outline: none;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.session-list-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--meta);
  padding: var(--space-3) var(--space-2) var(--space-2);
  font-weight: 500;
}
.session-item {
  display: grid;
  grid-template-columns: 6px 1fr;
  gap: var(--space-3);
  align-items: start;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  text-align: left;
  width: 100%;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  cursor: pointer;
  border: 1px solid transparent;
  position: relative;
}
.session-item:hover { background: var(--surface); }
.session-item.active {
  background: var(--surface);
  border-color: var(--border);
}
.session-item.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  border-radius: 2px;
  background: var(--signal);
}
.session-item:focus-visible { box-shadow: var(--focus-ring); }

.session-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: 7px;
  background: var(--meta);
  flex-shrink: 0;
}
.session-dot.complete { background: var(--success); }
.session-dot.warnings { background: var(--warn); }
.session-dot.running {
  background: var(--signal);
  box-shadow: 0 0 0 3px var(--signal-dim);
  animation: pulse-dot 1.6s var(--ease-standard) infinite;
}
.session-dot.cancelled { background: var(--meta); }
.session-dot.error { background: var(--danger); }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.session-title {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--fg);
  line-height: 1.4;
  letter-spacing: -0.01em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.session-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: 6px;
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
  font-weight: 400;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-mono);
  letter-spacing: 0;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--border);
  width: fit-content;
  max-width: max-content;
}
.badge-success,
.badge-warn,
.badge-muted {
  background: var(--surface-2);
  color: var(--muted);
  border-color: var(--border);
}
.badge-danger {
  background: rgba(212, 84, 84, 0.1);
  color: #e08a8a;
  border-color: rgba(212, 84, 84, 0.25);
}
.badge-accent {
  background: var(--signal-dim);
  color: var(--signal);
  border-color: color-mix(in oklab, var(--signal) 30%, transparent);
}
.badge-dot::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.9;
}

.sidebar-empty {
  padding: var(--space-10) var(--space-4);
  text-align: center;
  color: var(--muted);
  font-size: var(--text-sm);
}
.sidebar-empty strong {
  display: block;
  color: var(--fg);
  margin-bottom: var(--space-2);
  font-weight: 500;
}
.sidebar-foot {
  padding: 10px var(--space-4);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}
.sidebar-foot .foot-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sidebar-foot .foot-live::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--signal);
  box-shadow: 0 0 0 3px var(--signal-dim);
}

/* ─── main ──────────────────────────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: transparent;
  position: relative;
  z-index: 1;
}
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-5);
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 5;
  flex-shrink: 0;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  flex: 1;
}
.topbar-query {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--fg-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 42ch;
  letter-spacing: -0.01em;
}
.tabs {
  display: flex;
  align-items: stretch;
  gap: 0;
  height: var(--topbar-h);
  padding: 0;
  background: transparent;
  margin-left: var(--space-2);
}
.tab {
  height: 100%;
  padding: 0 14px;
  border-radius: 0;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  background: transparent;
}
.tab:hover { color: var(--fg); background: transparent; }
.tab.active {
  background: transparent;
  color: var(--fg);
  border-bottom-color: var(--signal);
  box-shadow: none;
  border-left: none;
  border-right: none;
  border-top: none;
}
.tab:disabled,
.tab[aria-disabled="true"] {
  opacity: 0.35;
  cursor: not-allowed;
  color: var(--meta);
}
.tab:disabled:hover,
.tab[aria-disabled="true"]:hover { color: var(--meta); }
.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
}
.menu-toggle { display: none; flex-shrink: 0; }

.content {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ─── compose — large editorial brief ───────────────────────────── */
.compose {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-8) var(--space-6);
  overflow-y: auto;
  position: relative;
}
.compose::before {
  content: "";
  position: absolute;
  width: min(640px, 90vw);
  height: 280px;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, color-mix(in oklab, var(--signal) 9%, transparent), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.compose-card {
  width: min(560px, 100%);
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
  border: none;
  position: relative;
  z-index: 1;
  animation: rise-in 520ms var(--ease-out) both;
}
@keyframes rise-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.compose-agents { display: none; }

.compose-card .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--signal);
  margin-bottom: var(--space-4);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
}
.compose-card .eyebrow::before {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--signal);
  opacity: 0.7;
}
.compose-card h1 {
  font-family: var(--font-display);
  font-size: clamp(36px, 5.2vw, 52px);
  margin-bottom: var(--space-4);
  color: var(--fg);
  letter-spacing: -0.025em;
  font-weight: 400;
  line-height: 0.98;
  max-width: 13ch;
}
.compose-card h1 em {
  font-style: italic;
  color: color-mix(in oklab, var(--fg) 88%, var(--signal));
}
.compose-card .lead {
  color: var(--fg-2);
  margin-bottom: var(--space-5);
  max-width: 44ch;
  font-size: var(--text-base);
  line-height: 1.65;
}
/* Signature agent strip — instrument codes, not chips-of-AI */
.compose-agent-rail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-bottom: var(--space-6);
  padding: 10px 0 2px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.compose-agent-rail span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--meta);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.compose-agent-rail span b {
  font-weight: 500;
  color: var(--fg-2);
  letter-spacing: 0.04em;
}
.compose-agent-rail span i {
  font-style: normal;
  color: var(--signal);
  opacity: 0.85;
}
.compose-input {
  width: 100%;
  min-height: 128px;
  resize: vertical;
  padding: var(--space-4);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--bg-sheet);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.55;
  color: var(--fg);
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
}
.compose-input::placeholder { color: var(--meta); }
.compose-input:hover { border-color: #3a4555; }
.compose-input:focus-visible {
  border-color: color-mix(in oklab, var(--signal) 50%, var(--border-strong));
  background: var(--surface);
  box-shadow: var(--focus-ring);
  outline: none;
}
.compose-input.invalid {
  border-color: color-mix(in oklab, var(--danger) 70%, #404040);
}
.compose-error {
  display: none;
  margin-top: var(--space-2);
  font-size: var(--text-xs);
  color: #e08a8a;
  font-family: var(--font-mono);
}
.compose-error.show { display: block; }
.compose-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-top: var(--space-3);
  flex-wrap: wrap;
}
.compose-hint {
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
}
.topbar-hint {
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.compose-examples {
  margin-top: var(--space-8);
  display: flex;
  flex-direction: column;
  gap: 0;
  border-top: 1px solid var(--border);
  padding-top: var(--space-4);
}
.compose-examples-label {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--meta);
  margin-bottom: var(--space-2);
  font-weight: 500;
}
.compose-examples-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.chip {
  height: auto;
  min-height: 40px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  color: var(--fg-2);
  background: transparent;
  border: 1px solid transparent;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: var(--space-3);
  align-items: center;
  text-align: left;
  width: 100%;
}
.chip .chip-n {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--meta);
}
.chip:hover {
  background: var(--surface);
  color: var(--fg);
  border-color: var(--border);
  transform: none;
}
.chip:hover .chip-n { color: var(--signal); }

/* ─── report — dossier sheet ────────────────────────────────────── */
.panel {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-6) var(--space-12);
  background:
    radial-gradient(900px 420px at 50% -10%, color-mix(in oklab, var(--signal) 5%, transparent), transparent 60%);
}
.panel-inner {
  max-width: 720px;
  margin: 0 auto;
  background:
    linear-gradient(165deg, color-mix(in oklab, var(--signal) 3%, var(--bg-sheet)) 0%, var(--bg-sheet) 28%),
    var(--bg-sheet);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-8) var(--space-8) var(--space-10);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 24px 64px -32px rgba(0,0,0,0.55);
  animation: rise-in 480ms var(--ease-out) both;
  position: relative;
  overflow: hidden;
}
.panel-inner::before {
  content: "";
  position: absolute;
  top: 0;
  left: 24px;
  right: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--signal) 40%, transparent), transparent);
  opacity: 0.7;
}
/* Dossier folio stamp — editorial signature */
.panel-inner::after {
  content: "DOSSIER";
  position: absolute;
  top: 22px;
  right: 22px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--meta);
  opacity: 0.45;
  pointer-events: none;
}

.degraded-banner {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  background: rgba(201, 162, 39, 0.08);
  border: 1px solid rgba(201, 162, 39, 0.28);
  margin-bottom: var(--space-6);
}
.degraded-banner svg {
  width: 16px;
  height: 16px;
  color: var(--warn);
  flex-shrink: 0;
  margin-top: 2px;
}
.degraded-banner strong {
  display: block;
  font-size: var(--text-sm);
  color: var(--fg);
  margin-bottom: 2px;
}
.degraded-banner p { font-size: var(--text-sm); color: var(--fg-2); }

.report-header {
  margin-bottom: var(--space-8);
  padding-bottom: var(--space-6);
  border-bottom: 1px solid var(--border);
}
.report-header .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--signal);
  margin-bottom: var(--space-3);
  font-weight: 500;
}
.report-header h1 {
  font-family: var(--font-display);
  font-size: clamp(30px, 4vw, 40px);
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: var(--space-4);
  max-width: 16ch;
  color: var(--fg);
  font-weight: 400;
}
.report-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 0;
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
  align-items: center;
}
.report-meta > span {
  display: inline-flex;
  align-items: center;
}
.report-meta > span:not(:last-child)::after {
  content: "";
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--meta);
  margin: 0 10px;
  opacity: 0.7;
}

.report-body {
  max-width: 58ch;
  font-size: var(--text-base);
  line-height: 1.72;
  color: var(--fg-2);
}
.report-body h2 {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: -0.015em;
  line-height: 1.1;
  color: var(--fg);
  margin: var(--space-10) 0 var(--space-3);
  font-weight: 400;
}
.report-body h3 {
  font-size: var(--text-base);
  letter-spacing: -0.015em;
  color: var(--fg);
  margin: var(--space-6) 0 var(--space-2);
  font-weight: 600;
  font-family: var(--font-body);
}
.report-body > p:first-child {
  color: var(--fg-2);
  max-width: 54ch;
  font-size: 16px;
  line-height: 1.72;
}
.report-body p + p { margin-top: var(--space-3); }
.report-body ul {
  margin: var(--space-3) 0 0;
  padding-left: 1.15em;
  color: var(--fg-2);
}
.report-body li + li { margin-top: var(--space-2); }
.report-body li::marker { color: var(--signal); }
.report-body li strong { color: var(--fg); font-weight: 600; }
.report-body .callout {
  margin: var(--space-6) 0;
  padding: var(--space-4) var(--space-4) var(--space-4) var(--space-5);
  border-radius: var(--radius-md);
  background: color-mix(in oklab, var(--signal) 6%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--signal) 18%, var(--border));
  border-left: 2px solid var(--signal);
  font-size: var(--text-sm);
  line-height: 1.65;
  color: var(--fg-2);
  position: relative;
}
.report-body .callout::before { display: none; }
.report-body .callout strong {
  color: var(--fg);
  font-family: var(--font-body);
}
.report-body .table-scroll {
  width: 100%;
  overflow-x: auto;
  margin: var(--space-5) 0;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-elev);
}
.report-body table {
  width: 100%;
  min-width: 420px;
  border-collapse: collapse;
  margin: 0;
  font-size: var(--text-sm);
}
.report-body th,
.report-body td {
  text-align: left;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}
.report-body tr:last-child td { border-bottom: none; }
.report-body th {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--meta);
  font-weight: 500;
  background: rgba(255,255,255,0.015);
}
.report-body td { color: var(--fg-2); }
.report-body td:first-child { color: var(--fg); font-weight: 500; }
.report-body tbody tr:hover td { background: rgba(255,255,255,0.015); }

.sources {
  margin-top: var(--space-10);
  border-top: 1px solid var(--border);
  padding-top: var(--space-3);
}
.sources-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: var(--space-3) 0;
  text-align: left;
  cursor: pointer;
}
.sources-toggle:hover .sources-toggle-label { color: var(--fg); }
.sources-toggle-label {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--fg-2);
  transition: color var(--motion-fast) var(--ease-standard);
}
.sources-toggle-label svg {
  width: 14px;
  height: 14px;
  transition: transform var(--motion-fast) var(--ease-standard);
  color: var(--signal);
}
.sources.open .sources-toggle-label svg { transform: rotate(90deg); }
.sources-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--meta);
}
.sources-list {
  display: none;
  flex-direction: column;
  gap: var(--space-2);
  padding-bottom: var(--space-2);
}
.sources.open .sources-list { display: flex; }
.source-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-3);
  align-items: start;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: transparent;
  border: 1px solid var(--border);
  text-align: left;
  width: 100%;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  cursor: pointer;
}
.source-item:hover {
  background: var(--surface);
  border-color: color-mix(in oklab, var(--signal) 25%, var(--border));
  transform: none;
  box-shadow: none;
}
.source-title {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--fg);
  margin-bottom: 2px;
  display: block;
}
.source-url {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--meta);
  word-break: break-all;
  display: block;
}
.source-agents {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;
}
.source-agents-modal {
  justify-content: flex-start;
  margin-bottom: var(--space-2);
}

/* ─── live trace — instrument lanes ─────────────────────────────── */
.trace-wrap {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-5) var(--space-5);
  animation: rise-in 400ms var(--ease-out) both;
  position: relative;
}
/* Live ticks re-render the DOM — never restart the entrance fade */
.trace-wrap.is-running,
.trace-wrap.is-finishing {
  animation: none;
}
.trace-wrap.is-running::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(720px 280px at 50% 0%, color-mix(in oklab, var(--signal) 7%, transparent), transparent 70%);
  z-index: 0;
}
.trace-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: var(--space-3);
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.trace-toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}
.trace-status {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: 11px;
  color: var(--meta);
  font-family: var(--font-mono);
  flex-wrap: wrap;
}
.trace-status .trace-active-count {
  color: var(--signal);
}
.trace-status [data-trace-hint].trace-active-count {
  font-weight: 500;
}
.trace-progress {
  height: 2px;
  width: 100%;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
.trace-progress-fill {
  height: 100%;
  width: var(--p, 0%);
  background: linear-gradient(90deg, color-mix(in oklab, var(--signal) 55%, var(--border)), var(--signal));
  border-radius: 99px;
  transition: width 280ms var(--ease-standard);
  box-shadow: 0 0 12px color-mix(in oklab, var(--signal) 35%, transparent);
}
.trace-wrap:not(.is-running) .trace-progress { display: none; }
.trace-wrap.is-finishing .trace-progress-fill {
  background: var(--signal);
  width: 100% !important;
}

.lanes {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-3);
  overflow: hidden;
  position: relative;
  z-index: 1;
}
.lane {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-sheet);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
  transition:
    border-color 320ms var(--ease-standard),
    opacity 320ms var(--ease-standard),
    box-shadow 320ms var(--ease-standard),
    transform 320ms var(--ease-out),
    background 320ms var(--ease-standard);
  position: relative;
  box-shadow: none;
}
.lane::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: transparent;
  z-index: 1;
  transition: background 320ms var(--ease-standard), opacity 320ms var(--ease-standard);
}

/* Active — lit instrument */
.lane.is-active {
  border-color: color-mix(in oklab, var(--signal) 48%, var(--border));
  box-shadow:
    0 0 0 1px color-mix(in oklab, var(--signal) 14%, transparent),
    0 12px 28px -18px color-mix(in oklab, var(--signal) 35%, transparent);
  transform: translateY(-2px);
  background: color-mix(in oklab, var(--signal) 4%, var(--bg-sheet));
  opacity: 1;
  z-index: 2;
}
.lane.is-active::before {
  background: linear-gradient(90deg, transparent, var(--signal), transparent);
  opacity: 1;
  animation: edge-pulse 1.8s var(--ease-standard) infinite;
}
.lane.is-active .lane-head {
  background: color-mix(in oklab, var(--signal) 8%, transparent);
}
.lane.is-active .lane-name .lane-code { color: var(--signal); }
.lane.is-active .badge-accent {
  animation: badge-soft 1.6s var(--ease-standard) infinite;
}

/* Done mid-run / finished */
.lane.is-done {
  opacity: 0.92;
  border-color: var(--border);
}
.lane.is-done .lane-name .lane-code {
  color: color-mix(in oklab, var(--signal) 55%, var(--meta));
}
.lane.is-done::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 2px;
  bottom: 0;
  background: color-mix(in oklab, var(--signal) 35%, transparent);
  opacity: 0.7;
}

/* Queued */
.lane.is-waiting {
  opacity: 0.48;
}
.lane.is-waiting .lane-name { color: var(--muted); font-weight: 500; }
.lane.is-waiting .lane-waiting strong {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.lane.is-waiting .lane-waiting strong::after {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--meta);
  animation: queue-dot 1.2s var(--ease-standard) infinite;
  box-shadow:
    7px 0 0 var(--meta),
    14px 0 0 var(--meta);
}

.trace-wrap.is-finishing .lane {
  opacity: 1;
  transform: none;
  border-color: color-mix(in oklab, var(--signal) 22%, var(--border));
}
.trace-wrap.is-finishing .lane::before {
  background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--signal) 55%, transparent), transparent);
  opacity: 0.7;
}

.lane-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: 12px 12px 11px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: transparent;
  transition: background 280ms var(--ease-standard);
}
.lane-name {
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: -0.015em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.lane-name .lane-code {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--meta);
  min-width: 1.4em;
  transition: color 280ms var(--ease-standard);
}
.lane-name::before { display: none; }
.lane-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  scroll-behavior: smooth;
  background: transparent;
}
.trace-entry {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  transition: background var(--motion-fast) var(--ease-standard);
  cursor: pointer;
  border: 1px solid transparent;
}
.trace-entry.is-new {
  animation: entry-in 480ms var(--ease-out) both;
  background: color-mix(in oklab, var(--signal) 7%, transparent);
  border-color: color-mix(in oklab, var(--signal) 14%, transparent);
}
.trace-entry:hover {
  background: var(--surface);
  border-color: transparent;
}
.trace-entry.is-new:hover {
  background: color-mix(in oklab, var(--signal) 10%, var(--surface));
}
.trace-entry:focus-visible { box-shadow: var(--focus-ring); }
.trace-entry.error {
  background: rgba(212, 84, 84, 0.08);
  border-color: transparent;
}
.trace-entry.error:hover {
  background: rgba(212, 84, 84, 0.12);
}
.trace-entry-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--meta);
  margin-bottom: 3px;
  letter-spacing: 0;
}
.trace-entry-text {
  font-size: var(--text-sm);
  color: var(--fg-2);
  line-height: 1.45;
}
.trace-entry.error .trace-entry-text { color: #e08a8a; }
.lane-waiting {
  padding: var(--space-8) var(--space-3);
  text-align: center;
  color: var(--meta);
  font-size: 11px;
  font-family: var(--font-mono);
  line-height: 1.5;
}
.lane-waiting strong {
  display: block;
  color: var(--fg-2);
  font-weight: 500;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  margin-bottom: 2px;
  letter-spacing: -0.01em;
}
.lane-live-bar {
  height: 2px;
  background: transparent;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
}
.lane.is-active .lane-live-bar {
  background: color-mix(in oklab, var(--signal) 16%, transparent);
}
.lane.is-active .lane-live-bar::after {
  content: "";
  display: block;
  height: 100%;
  width: 38%;
  background: linear-gradient(90deg, transparent, var(--signal), transparent);
  animation: lane-scan 1.15s linear infinite;
  opacity: 1;
}
.lane.is-done .lane-live-bar {
  background: color-mix(in oklab, var(--signal) 10%, transparent);
}

@keyframes lane-scan {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}
@keyframes entry-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes edge-pulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@keyframes badge-soft {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}
@keyframes queue-dot {
  0%, 100% {
    opacity: 0.35;
    box-shadow: 7px 0 0 rgba(107, 115, 130, 0.35), 14px 0 0 rgba(107, 115, 130, 0.2);
  }
  40% {
    opacity: 1;
    box-shadow: 7px 0 0 var(--meta), 14px 0 0 rgba(107, 115, 130, 0.45);
  }
}

/* ─── drawer ────────────────────────────────────────────────────── */
.drawer-backdrop {
  position: fixed;
  inset: 0;

  /** Pure helper: recompute concurrent lane states from timing windows. */
  function recomputeLaneStates(session, elapsed, opts) {
    const windowMs = (opts && opts.activeWindow) || 950;
    const agents = (opts && opts.agents) || AGENTS;
    const agentLastAt = session._agentLastAt || {};
    const lanes = session.lanes || {};
    const next = {};
    agents.forEach((a) => {
      const has = lanes[a] && lanes[a].length > 0;
      const last = agentLastAt[a];
      const recent = last != null && elapsed - last < windowMs;
      if (recent) next[a] = "active";
      else if (has) next[a] = "complete";
      else next[a] = "waiting";
    });
    const anyActive = agents.some((a) => next[a] === "active");
    const scriptRemaining = opts && typeof opts.scriptRemaining === "number" ? opts.scriptRemaining : 0;
    if (!anyActive && session._lastAgent && scriptRemaining > 0 && agents.indexOf(session._lastAgent) >= 0) {
      next[session._lastAgent] = "active";
    }
    return next;
  }

  let focusTrapCleanup = null;

  function lockBodyScroll() {

    if (!root) return [];
    return $$(
      'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])',
      root
    ).filter((el) => !el.hasAttribute("disabled") && el.offsetParent !== null);
  }

  function trapFocus(root) {
    releaseFocusTrap();
    const onKey = (e) => {
      if (e.key !== "Tab") return;
      const nodes = getFocusable(root);
      if (!nodes.length) return;
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusTrapCleanup = () => {
      document.removeEventListener("keydown", onKey);
      focusTrapCleanup = null;
    };
  }

  function releaseFocusTrap() {
    if (focusTrapCleanup) focusTrapCleanup();
  }

    if (s.state === "cancelled") {

    }
    if (s.state === "running" && laneState === "waiting") {
      return `<div class="lane-waiting"><strong>Queued</strong>Waiting for upstream work…</div>`;
    }
    if (laneState === "waiting" || !laneState) {

    return `<div class="lane-waiting">Waiting…</div>`;

  function lanePresentation(s, name) {
    const running = s.state === "running";
    const finishing = !!s._finishing;
    const entries = (s.lanes && s.lanes[name]) || [];
    const last = entries[entries.length - 1];
    let laneState = "waiting";
    if (running || finishing) {
      if (s._laneState && s._laneState[name]) laneState = s._laneState[name];
      else if (entries.length) laneState = "active";
    } else if (last && last.error) laneState = "error";
    else if (entries.length) laneState = "complete";
    else if (s.state === "cancelled") laneState = "waiting";

    let badgeCls = "badge-muted";
    let badgeText = "Waiting";
    if (laneState === "active") { badgeCls = "badge-accent"; badgeText = "Active"; }
    if (laneState === "complete") {
      badgeCls = "badge-muted";
      badgeText = running || finishing ? "Done" : "Complete";
    }
    if (laneState === "error") { badgeCls = "badge-danger"; badgeText = "Error"; }
    if (s.state === "cancelled") {
      badgeCls = "badge-muted";
      badgeText = entries.length ? "Stopped" : "Idle";
    }

    let laneMod = "";
    if ((running || finishing) && laneState === "active") laneMod = "is-active";
    else if ((running || finishing) && laneState === "complete") laneMod = "is-done";
    else if ((running || finishing) && laneState === "waiting") laneMod = "is-waiting";
    else if (s.state === "cancelled" && !entries.length) laneMod = "is-waiting";
    else if (!running && !finishing && entries.length) laneMod = "is-done";

    return { laneState, badgeCls, badgeText, laneMod, entries };
  }

  function renderEntryHtml(name, e, i, now) {
    const isNew = e._at && now - e._at < 750;
    return `
            <button type="button" class="trace-entry${e.error ? " error" : ""}${isNew ? " is-new" : ""}" data-agent="${escapeAttr(name)}" data-idx="${i}">
              <div class="trace-entry-time">${escapeHtml(e.t)}</div>
              <div class="trace-entry-text">${escapeHtml(e.text)}</div>
            </button>`;
  }

  function renderTrace(s) {
    const st = stateLabel(s.state);
    const running = s.state === "running";
    const finishing = !!s._finishing;
    const progress = Math.max(0, Math.min(100, s._progress || 0));
    const activeCount = countActiveLanes(s._laneState);
    const now = Date.now();
    const hint = traceHintText(s, activeCount);

    const lanes = AGENTS.map((name) => {
      const { laneState, badgeCls, badgeText, laneMod, entries } = lanePresentation(s, name);
      const body =
        entries.length === 0
          ? emptyLaneMessage(s, name, laneState)
          : entries.map((e, i) => renderEntryHtml(name, e, i, now)).join("");

      return `
        <section class="lane${laneMod ? " " + laneMod : ""}" data-od-id="lane-${name.toLowerCase()}" data-agent="${escapeAttr(name)}" data-lane-state="${escapeAttr(laneState)}">
          <div class="lane-head">
            <span class="lane-name"><span class="lane-code">${AGENT_CODES[name] || ""}</span>${escapeHtml(name)}</span>
            <span class="badge ${badgeCls}${laneState === "active" ? " badge-dot" : ""}" data-lane-badge>${badgeText}</span>
          </div>
          <div class="lane-live-bar" aria-hidden="true"></div>
          <div class="lane-body" data-lane-scroll="${escapeAttr(name)}">${body}</div>
        </section>`;
    }).join("");

    const wrapClass = [
      "trace-wrap",
      running ? "is-running" : "",
      finishing ? "is-finishing is-running" : ""
    ].filter(Boolean).join(" ");

    return `
      <div class="${wrapClass}" data-od-id="trace-view">
        <div class="trace-toolbar">
          <div class="trace-toolbar-row">
            <div class="trace-status" role="status" aria-live="polite" aria-atomic="true">
              <span class="badge ${finishing ? "badge-accent" : st.cls} badge-dot" data-trace-badge>${finishing ? "Finalizing" : st.text}</span>
              <span data-trace-duration>${escapeHtml(s.duration || "—")}</span>
              <span class="trace-hint-narrow-hide" aria-hidden="true">·</span>
              <span data-trace-hint class="${running && activeCount ? "trace-active-count" : ""}">${escapeHtml(hint)}</span>
            </div>
          </div>
          <div class="trace-progress" style="--p:${progress}%" aria-hidden="true" data-trace-progress>
            <div class="trace-progress-fill"></div>
          </div>
        </div>
        <div class="lanes" id="lanes">${lanes}</div>
      </div>`;
  }

  function bindTraceEntry(el, s) {
    el.onclick = () => {
      const agent = el.dataset.agent;
      const idx = +el.dataset.idx;
      const entry = s.lanes[agent] && s.lanes[agent][idx];
      if (entry) openDrawer(agent, idx, entry, s);
    };
  }

  function wireTrace(s) {
    $$(".trace-entry").forEach((el) => bindTraceEntry(el, s));
    $$("[data-lane-scroll]").forEach((body) => {
      if (body.dataset.scrollWired === "1") return;
      body.dataset.scrollWired = "1";
      const name = body.dataset.laneScroll;
      body.addEventListener("scroll", () => {
        const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
        autoScrollPaused[name] = !nearBottom;
      });
    });
    $$("[data-lane-scroll]").forEach((body) => {
      const name = body.dataset.laneScroll;
      if (!autoScrollPaused[name]) body.scrollTop = body.scrollHeight;
    });
  }

  /** Patch Live Trace in place — avoids full-panel re-render / animation restarts. */
  function patchTrace(s) {
    const wrap = document.querySelector('[data-od-id="trace-view"]');
    if (!wrap) return false;

    const running = s.state === "running";
    const finishing = !!s._finishing;
    const progress = Math.max(0, Math.min(100, s._progress || 0));
    const activeCount = countActiveLanes(s._laneState);
    const st = stateLabel(s.state);
    const now = Date.now();

    wrap.classList.toggle("is-running", running || finishing);
    wrap.classList.toggle("is-finishing", finishing);

    const badge = wrap.querySelector("[data-trace-badge]");
    if (badge) {
      badge.className = "badge " + (finishing ? "badge-accent" : st.cls) + " badge-dot";
      badge.textContent = finishing ? "Finalizing" : st.text;
    }
    const dur = wrap.querySelector("[data-trace-duration]");
    if (dur) dur.textContent = s.duration || "—";
    const hintEl = wrap.querySelector("[data-trace-hint]");
    if (hintEl) {
      const hint = traceHintText(s, activeCount);
      hintEl.textContent = hint;
      hintEl.classList.toggle("trace-active-count", !!(running && activeCount));
    }
    const prog = wrap.querySelector("[data-trace-progress]");
    if (prog) prog.style.setProperty("--p", progress + "%");

    AGENTS.forEach((name) => {
      const { laneState, badgeCls, badgeText, laneMod, entries } = lanePresentation(s, name);
      const lane = wrap.querySelector('.lane[data-agent="' + CSS.escape(name) + '"]');
      if (!lane) return;

      lane.classList.remove("is-active", "is-done", "is-waiting");
      if (laneMod) lane.classList.add(laneMod);
      lane.dataset.laneState = laneState;

      const laneBadge = lane.querySelector("[data-lane-badge]");
      if (laneBadge) {
        laneBadge.className = "badge " + badgeCls + (laneState === "active" ? " badge-dot" : "");
        laneBadge.textContent = badgeText;
      }

      const body = lane.querySelector("[data-lane-scroll]");
      if (!body) return;

      if (entries.length === 0) {
        if (!body.querySelector(".lane-waiting") || body.querySelectorAll(".trace-entry").length) {
          body.innerHTML = emptyLaneMessage(s, name, laneState);
        }
        return;
      }

      // Drop empty state if entries arrived
      if (body.querySelector(".lane-waiting")) body.innerHTML = "";

      const existing = body.querySelectorAll(".trace-entry").length;
      for (let i = existing; i < entries.length; i++) {
        const tmp = document.createElement("div");
        tmp.innerHTML = renderEntryHtml(name, entries[i], i, now).trim();
        const btn = tmp.firstElementChild;
        if (btn) {
          bindTraceEntry(btn, s);
          body.appendChild(btn);
        }
      }

      // Refresh is-new flags without rebuilding list
      body.querySelectorAll(".trace-entry").forEach((el, i) => {
        const e = entries[i];
        if (!e) return;
        const isNew = e._at && now - e._at < 750;
        el.classList.toggle("is-new", !!isNew);
        el.classList.toggle("error", !!e.error);
      });

      if (!autoScrollPaused[name]) body.scrollTop = body.scrollHeight;
    });

    return true;
  }

  /* ─── drawer ──────────────────────────────────────────────────── */
  function openDrawer(agent, idx, entry, session) {
    lastFocusEl = document.activeElement;
    drawerEntry = { agent, idx, entry };
    $("#drawer-title").textContent = entry.text;
    $("#drawer-sub").textContent = `${agent} · step ${idx + 1} of ${session.lanes[agent].length} · ${entry.t}`;
    $("#drawer-body").innerHTML = `
      <div class="drawer-section">
        <label>Agent</label>
        <div><span class="badge badge-muted">${escapeHtml(agent)}</span>${entry.error ? ' <span class="badge badge-danger">Error</span>' : ""}</div>
      </div>
      <div class="drawer-section">
        <label>Input</label>
        <pre class="drawer-pre">${escapeHtml(entry.input || "—")}</pre>
      </div>
      <div class="drawer-section">
        <label>Output</label>
        <pre class="drawer-pre">${escapeHtml(entry.output || "—")}</pre>
      </div>`;
    $("#drawer").classList.add("open");
    $("#drawer-backdrop").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
    $("#drawer-backdrop").setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#drawer"));
    $("#drawer-close").focus();
  }

  function closeDrawer() {
    if (!$("#drawer").classList.contains("open")) return;
    $("#drawer").classList.remove("open");
    $("#drawer-backdrop").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#drawer-backdrop").setAttribute("aria-hidden", "true");
    drawerEntry = null;
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  /* ─── source modal ────────────────────────────────────────────── */
  function openSourceModal(src) {
    lastFocusEl = document.activeElement;
    $("#source-modal-title").textContent = src.title;
    $("#source-modal-body").textContent = src.url;
    $("#source-modal-agents").innerHTML = src.agents
      .map((a) => `<span class="badge badge-muted">${escapeHtml(a)}</span>`)
      .join("");
    const link = $("#source-modal-open");
    link.href = src.url;
    $("#source-modal").classList.add("open");
    $("#source-modal").setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#source-modal .modal") || $("#source-modal"));
    $("#source-modal-close").focus();
  }

  function closeSourceModal() {
    if (!$("#source-modal").classList.contains("open")) return;
    $("#source-modal").classList.remove("open");
    $("#source-modal").setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  /* ─── actions ─────────────────────────────────────────────────── */
  function copyReport() {
    const s = activeSession();
    if (!s || !s.report) return;
    const text = reportToMarkdown(s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast("Report copied"),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Report copied");
    } catch {
      showToast("Copy failed");
    }
    ta.remove();
  }

  function downloadMarkdown() {
    const s = activeSession();
    if (!s || !s.report) return;
    const md = reportToMarkdown(s);
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slugify(s.report.title) + ".md";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
    showToast("Markdown downloaded");
  }

  function reportToMarkdown(s) {
    const r = s.report;
    const tmp = document.createElement("div");
    tmp.innerHTML = r.html;
    let body = "";
    tmp.childNodes.forEach((node) => {
      if (node.nodeType !== 1) return;
      const tag = node.tagName.toLowerCase();
      if (tag === "h2") body += `\n## ${node.textContent.trim()}\n\n`;
      else if (tag === "h3") body += `\n### ${node.textContent.trim()}\n\n`;
      else if (tag === "p") body += `${node.textContent.trim()}\n\n`;
      else if (tag === "div") body += `> ${node.textContent.trim()}\n\n`;
      else if (tag === "ul") {
        node.querySelectorAll("li").forEach((li) => {
          body += `- ${li.textContent.trim()}\n`;
        });
        body += "\n";
      } else if (tag === "table") {
        const rows = [...node.querySelectorAll("tr")];
        rows.forEach((tr, i) => {
          const cells = [...tr.children].map((c) => c.textContent.trim());
          body += `| ${cells.join(" | ")} |\n`;
          if (i === 0) body += `| ${cells.map(() => "---").join(" | ")} |\n`;
        });
        body += "\n";
      }
    });
    let sources = "\n## Sources\n\n";
    (r.sources || []).forEach((src) => {
      sources += `- [${src.title}](${src.url}) — ${src.agents.join(", ")}\n`;
    });
    const warn = s.degraded ? `\n> **Warning:** ${s.degradedNote}\n` : "";
    return `# ${r.title}\n\n*Query:* ${s.query}\n${warn}\n${body}${sources}`;
  }

  function submitQuery(raw) {
    const q = (raw || "").trim();
    const input = $("#compose-input");
    const err = $("#compose-error");
    if (!q) {
      if (input) {
        input.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
        input.focus();
        if (err) {
          err.textContent = "Enter a research query to run the agent graph.";
          err.classList.add("show");
        }
        showToast("Enter a research query");
      }
      return;
    }
    const id = "s" + Date.now();
    const now = new Date();
    const session = {
      id,
      query: q,
      state: "running",
      createdAt: now.toISOString(),
      duration: "0s",
      degraded: false,
      report: null,
      lanes: { Analyst: [], Researcher: [], "Fact-checker": [], Synthesizer: [] },
      _laneState: { Analyst: "waiting", Researcher: "waiting", "Fact-checker": "waiting", Synthesizer: "waiting" },
      _start: Date.now()
    };
    sessions.unshift(session);
    activeId = id;
    composeMode = false;
    view = "trace";
    render();
    simulateRun(session);
  }

  function simulateRun(session) {
    clearInterval(runTimer);
    if (session._finishTimer) {
      clearTimeout(session._finishTimer);
      session._finishTimer = null;
    }

    const script = [
      { at: 350, agent: "Analyst", text: "Parsed query into research objectives", input: session.query, output: "Objectives extracted; domain classified as enterprise research." },
      { at: 480, agent: "Researcher", text: "Issued web & document retrieval", input: "Primary entities from query", output: "Retrieval fan-out started across public docs and filings." },
      { at: 1100, agent: "Analyst", text: "Drafted evaluation criteria", input: "Objectives", output: "Weighted criteria drafted for scoring." },
      { at: 1450, agent: "Researcher", text: "Ranked sources by relevance", input: "Raw retrieval set", output: "Top sources retained for fact-checking." },
      { at: 1900, agent: "Fact-checker", text: "Validating primary claims", input: "Researcher source pack", output: "Claim inventory created; checking dates and attributions." },
      { at: 2400, agent: "Researcher", text: "Extracted competitive differentiators", input: "Filtered sources", output: "Differentiator table for synthesis." },
      { at: 2700, agent: "Analyst", text: "Scored options against criteria", input: "Evidence + criteria", output: "Preliminary ranking complete." },
      { at: 3100, agent: "Fact-checker", text: "Confirmed no contradictory filings", input: "Claim inventory", output: "No hard contradictions in public sources reviewed." },
      { at: 3600, agent: "Synthesizer", text: "Composing executive summary", input: "All lane outputs", output: "Outline locked; writing recommendation." },
      { at: 4300, agent: "Synthesizer", text: "Finalized report & source map", input: "Draft + provenance", output: "Report ready." }
    ];
    const totalMs = 4800;
    const ACTIVE_WINDOW = 950;

    session._agentLastAt = {};
    session._lastAgent = null;
    session._progress = 0;
    session._finishing = false;
    AGENTS.forEach((a) => { session._laneState[a] = "waiting"; });

    let i = 0;
    const start = Date.now();

    function recomputeStates(elapsed) {
      session._laneState = recomputeLaneStates(session, elapsed, {
        activeWindow: ACTIVE_WINDOW,
        agents: AGENTS,
        scriptRemaining: script.length - i
      });
    }

    function paint(forceFull) {
      if (activeId === session.id && view === "trace" && !composeMode) {
        renderTopbar();
        renderSidebar();
        const root = $("#content");
        const canPatch = !forceFull && root.querySelector('[data-od-id="trace-view"]');
        if (canPatch && patchTrace(session)) {
          return;
        }
        root.innerHTML = renderTrace(session);
        wireTrace(session);
      } else {
        renderSidebar();
        renderTopbar();
      }
    }

    function finishRun() {
      clearInterval(runTimer);
      runTimer = null;
      AGENTS.forEach((a) => { session._laneState[a] = "complete"; });
      session._progress = 100;
      session._finishing = true;
      session.state = "complete";
      session.duration = Math.round((Date.now() - start) / 1000) + "s";
      session.report = buildLiveReport(session);
      paint();

      session._finishTimer = setTimeout(() => {
        session._finishing = false;
        session._finishTimer = null;
        if (activeId === session.id && !composeMode) {
          view = "report";
          render();
          showToast("Report ready");
        }
      }, 780);
    }

    function tick() {
      const elapsed = Date.now() - start;
      session.duration = Math.round(elapsed / 1000) + "s";
      session._progress = Math.min(99, Math.round((elapsed / totalMs) * 100));

      while (i < script.length && script[i].at <= elapsed) {
        const step = script[i++];
        const t = new Date();
        const ts = t.toTimeString().slice(0, 8);
        session.lanes[step.agent].push({
          t: ts,
          text: step.text,
          input: step.input,
          output: step.output,
          _at: Date.now()
        });
        session._agentLastAt[step.agent] = elapsed;
        session._lastAgent = step.agent;
      }

      recomputeStates(elapsed);

      if (i >= script.length && elapsed > totalMs) {
        finishRun();
        return;
      }

      paint();
    }

    runTimer = setInterval(tick, 160);
    tick();
  }

  function buildLiveReport(session) {

  function openCancelModal() {
    const s = activeSession();
    if (!s || s.state !== "running") return;
    lastFocusEl = document.activeElement;
    const modal = $("#cancel-modal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#cancel-modal .modal") || modal);
    $("#cancel-modal-confirm").focus();
  }

  function closeCancelModal() {
    const modal = $("#cancel-modal");
    if (!modal.classList.contains("open")) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  function cancelRun() {
    const s = activeSession();
    if (!s || (s.state !== "running" && !s._finishing)) return;
    closeCancelModal();
    clearInterval(runTimer);
    runTimer = null;
    if (s._finishTimer) {
      clearTimeout(s._finishTimer);
      s._finishTimer = null;
    }
    s._finishing = false;
    s.state = "cancelled";
    s.duration = Math.round((Date.now() - (s._start || Date.now())) / 1000) + "s";
    AGENTS.forEach((a) => {
      if (s._laneState[a] === "active" || s._laneState[a] === "waiting") {
        if (s.lanes[a].length) s._laneState[a] = "complete";
        else s._laneState[a] = "waiting";
      }
    });
    AGENTS.forEach((a) => {
      if (s.lanes[a].length) {
        s.lanes[a].push({
          t: new Date().toTimeString().slice(0, 8),
          text: "Run cancelled by user",
          input: "Stop control",
          output: "Lane halted; no further actions.",
          error: false
        });
      }
    });
    s.report = null;
    view = "trace";
    render();
    showToast("Research stopped — no report generated", { variant: "destructive", duration: 3800 });
  }

  /* ─── master render ───────────────────────────────────────────── */
  function render() {
    renderSidebar();
    renderTopbar();
    renderContent();
  }

  /* ─── events ──────────────────────────────────────────────────── */
  $("#btn-new-research").addEventListener("click", () => {
    composeMode = true;
    view = "compose";
    setSidebarOpen(false);
    render();
  });

  $("#session-list").addEventListener("click", (e) => {
    const item = e.target.closest(".session-item");
    if (!item) return;
    activeId = item.dataset.id;
    composeMode = false;
    const s = activeSession();
    view = s && (s.state === "complete" || s.state === "warnings") ? "report" : "trace";
    setSidebarOpen(false);
    render();
  });

  $("#session-filter").addEventListener("input", renderSidebar);

  $("#view-tabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab || tab.disabled) return;
    view = tab.dataset.view;
    render();
  });

  $("#menu-toggle").addEventListener("click", () => setSidebarOpen(!sidebarOpen));
  $("#sidebar-scrim").addEventListener("click", () => setSidebarOpen(false));
  window.addEventListener("resize", () => {
    if (window.innerWidth > 860 && sidebarOpen) setSidebarOpen(false);
  });

  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  $("#source-modal-close").addEventListener("click", closeSourceModal);
  $("#source-modal").addEventListener("click", (e) => {
    if (e.target === $("#source-modal")) closeSourceModal();
  });
  $("#cancel-modal-keep").addEventListener("click", closeCancelModal);
  $("#cancel-modal-confirm").addEventListener("click", cancelRun);
  $("#cancel-modal").addEventListener("click", (e) => {
    if (e.target === $("#cancel-modal")) closeCancelModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("#drawer").classList.contains("open")) closeDrawer();
      else if ($("#cancel-modal").classList.contains("open")) closeCancelModal();
      else if ($("#source-modal").classList.contains("open")) closeSourceModal();
      else if (sidebarOpen) setSidebarOpen(false);
    }
  });

  /* ─── utils ───────────────────────────────────────────────────── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }
  function truncate(str, n) {
    if (!str) return "";
    return str.length > n ? str.slice(0, n - 1) + "…" : str;
  }
  function slugify(str) {
    return String(str)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 60) || "report";
  }

  /* Expose pure helpers for tests (no Node require of the page). */
  window.__ResearchUI = {
    AGENTS,
    AGENT_CODES,
    stateLabel,
    recomputeLaneStates,
    countActiveLanes,
    traceHintText,
    escapeHtml,
    escapeAttr,
    truncate,
    slugify,
    reportToMarkdown
  };

  /* ─── init: open completed report for evaluators ──────────────── */
  activeId = "s1";
  composeMode = false;
  view = "report";
  render();
})();
  </script>
</body>
</html>

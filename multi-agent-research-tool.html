<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1014" />
  <meta name="color-scheme" content="dark" />
  <title>Research · Multitrack</title>
  <style>

/* THESIS: Multitrack research desk — stages + parallel tracks, simplified scan surface.
   OWN-WORLD: Graphite console, amber live LED at full strength, mono DEMO line; flat tonal layering.
   STORY: Builder demos plan→fan-out→verify→report; boldness from LED/hierarchy, not extra chrome.
   FIRST VIEWPORT: Takes left; Stages (step strip + compact tracks) or Report; DEMO status bottom.
   FORM: Multitrack Research Session (polish pass); Operate mode. */

:root {
  --bg: #0e1014;
  --panel: #161a21;
  --track: #1c2129;
  --track-armed: #252b36;
  --fg: #e8e6e1;
  --fg-2: #9aa1ad;
  --muted: #8a919d;
  --meta: #8a919d;
  --border: #2a303a;
  --border-strong: #3a4250;
  --led: #e6a23c;
  --led-dim: #c48a2e;
  --led-glow: color-mix(in oklab, var(--led) 42%, transparent);
  --led-soft: color-mix(in oklab, var(--led) 14%, transparent);
  --play: #4d9f6a;
  --danger: #e06a6a;
  --danger-ink: #1a0c0c;
  --warn: #c9a227;
  --btn: #e8e6e1;
  --btn-ink: #0e1014;
  --pure-white: #ffffff;
  --selection: color-mix(in oklab, var(--led) 28%, var(--panel));
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 14px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: clamp(2rem, 4.5vw, 2.75rem);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  /* Content gutters: chrome vs instrument/report columns */
  --gutter-chrome: var(--space-4);
  --gutter: var(--space-5);
  --stack-tight: var(--space-2);
  --stack-group: var(--space-4);
  --stack-section: var(--space-6);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-pill: 999px;
  --sidebar-w: 240px;
  --transport-h: 40px;
  --topbar-h: 48px;
  --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--led-glow);
  --motion: 180ms cubic-bezier(0.2, 0, 0, 1);
  --z-scrim: 25;
  --z-sidebar: 30;
  --z-drawer: 50;
  --z-modal: 55;
  --z-toast: 80;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--led); }
a:hover { color: color-mix(in oklab, var(--led) 80%, #fff); }
::selection { background: var(--selection); color: var(--fg); }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* Dark console scrollbars */
.content, .session-list, .lane-entries, .drawer-body {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
.content::-webkit-scrollbar,
.session-list::-webkit-scrollbar,
.lane-entries::-webkit-scrollbar,
.drawer-body::-webkit-scrollbar { width: 8px; height: 8px; }
.content::-webkit-scrollbar-thumb,
.session-list::-webkit-scrollbar-thumb,
.lane-entries::-webkit-scrollbar-thumb,
.drawer-body::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-pill);
}

/* ── app shell ───────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr;
  height: 100%;
  min-height: 100vh;
}
.sidebar-scrim {
  display: none;
  position: fixed; inset: 0;
  background: color-mix(in oklab, #000 55%, transparent);
  z-index: var(--z-scrim);
}

/* ── take library ────────────────────────────────────────── */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: var(--z-sidebar);
}
.sidebar-head {
  padding: var(--space-4) var(--gutter-chrome) var(--space-3);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: var(--stack-group);
}
.field-search.is-hidden { display: none; }
.brand-row { display: flex; align-items: center; gap: var(--space-2); }
.brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.brand-mark {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--led);
  color: var(--btn-ink);
  border: 1px solid color-mix(in oklab, var(--led) 70%, #000);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700;
  letter-spacing: -0.03em;
  box-shadow: 0 0 0 3px var(--led-soft);
}
.brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-name { font-weight: 700; font-size: var(--fs-md); letter-spacing: -0.02em; }
.brand-sub {
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--led-dim);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 34px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm); font-weight: 700;
  letter-spacing: -0.01em;
  transition: background var(--motion), color var(--motion), border-color var(--motion), transform var(--motion), box-shadow var(--motion);
}
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn-block { width: 100%; height: 38px; }
.btn-primary {
  background: var(--btn); color: var(--btn-ink);
  box-shadow: 0 1px 0 color-mix(in oklab, #fff 12%, transparent) inset;
}
.btn-primary:hover:not(:disabled) {
  background: var(--pure-white);
  filter: none;
  transform: translateY(-1px);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-secondary {
  background: var(--track); color: var(--fg);
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover:not(:disabled) { border-color: var(--muted); background: var(--track-armed); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover:not(:disabled) { background: var(--track); color: var(--fg); }
.btn-danger { background: var(--danger); color: var(--danger-ink); font-weight: 700; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.06); }
.btn-danger-ghost { color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger) 40%, transparent); }
.btn-danger-ghost:hover:not(:disabled) { background: color-mix(in oklab, var(--danger) 12%, transparent); }
.btn-sm { height: 32px; min-width: 32px; padding: 0 var(--space-2); font-size: var(--fs-xs); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.field-search {
  display: flex; align-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 0 var(--space-3); height: 34px;
  transition: border-color var(--motion), box-shadow var(--motion);
}
.field-search:focus-within {
  border-color: var(--led);
  box-shadow: var(--focus);
}
.field-search input {
  flex: 1; border: 0; background: transparent; outline: none;
  font-size: var(--fs-sm); color: var(--fg); min-width: 0;
  height: 100%;
}
.field-search input::placeholder { color: var(--meta); }
.field-search input:focus-visible { box-shadow: none; }

.session-list {
  flex: 1; overflow: auto; padding: var(--space-2);
  min-height: 0;
}

.session-item {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 8px 1fr; gap: var(--space-3); align-items: start;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  color: var(--fg-2); transition: background var(--motion), color var(--motion), box-shadow var(--motion);
}
.session-item:hover { background: var(--track); color: var(--fg); }
.session-item.active {
  background: var(--track-armed); color: var(--fg);
  box-shadow: inset 3px 0 0 var(--led);
}
.session-item.active .session-title { font-weight: 600; }
.session-item:focus-visible { box-shadow: var(--focus); }
.session-item.active:focus-visible {
  box-shadow: inset 3px 0 0 var(--led), var(--focus);
}
.session-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 5px;
  background: var(--meta);
}
.session-dot.complete { background: var(--play); }
.session-dot.warnings { background: var(--warn); }
.session-dot.running {
  background: var(--led);
  box-shadow: 0 0 0 3px var(--led-glow);
  animation: pulse-led 1.2s ease-in-out infinite;
}
.session-dot.cancelled, .session-dot.error { background: var(--danger); }
@keyframes pulse-led {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.session-title {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: var(--fs-sm); font-weight: 500;
  color: inherit; line-height: 1.35;
}
.session-meta {
  display: block;
  margin-top: var(--space-1); font-size: var(--fs-xs); color: var(--meta);
}
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: var(--fs-xs); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: var(--radius-pill);
  background: var(--track); color: var(--fg-2);
  border: 1px solid var(--border);
}
.badge-running { color: var(--led); border-color: color-mix(in oklab, var(--led) 35%, transparent); }
.badge-complete { color: var(--play); border-color: color-mix(in oklab, var(--play) 35%, transparent); }
.badge-warnings { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); }
.badge-cancelled, .badge-error {
  color: color-mix(in oklab, var(--danger) 82%, #fff);
  border-color: color-mix(in oklab, var(--danger) 45%, transparent);
  background: color-mix(in oklab, var(--danger) 12%, var(--track));
}
.badge-dot::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
}
.sidebar-empty {
  padding: var(--space-8) var(--space-3); text-align: center; color: var(--muted);
  font-size: var(--fs-sm);
}
.sidebar-empty strong { display: block; color: var(--fg-2); margin-bottom: var(--space-1); }
.sidebar-foot {
  padding: var(--space-2) var(--gutter-chrome);
  border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--led-dim);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ── main ────────────────────────────────────────────────── */
.main {
  display: grid;
  grid-template-rows: var(--topbar-h) 1fr auto;
  min-width: 0; min-height: 0;
  background: var(--bg);
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3);
  padding: 0 var(--gutter-chrome);
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  min-width: 0;
}
.topbar-left {
  display: flex; align-items: center; gap: var(--space-3); min-width: 0; flex: 1;
}
.menu-toggle {
  display: none;
  min-width: 36px;
  min-height: 36px;
  padding: 0;
}
.topbar-query {
  font-size: var(--fs-sm); font-weight: 600; color: var(--fg);
  letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex: 1 1 12ch; max-width: min(36ch, 100%);
}
.tabs {
  display: inline-flex; gap: 0.125rem;
  background: var(--bg); padding: 0.1875rem; border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  flex-shrink: 0;
}
.tabs.hidden { display: none; }
.tab {
  height: 30px; padding: 0 var(--space-3); border-radius: var(--radius-sm);
  font-size: var(--fs-sm); font-weight: 700; color: var(--muted);
  letter-spacing: -0.01em;
  transition: background var(--motion), color var(--motion), box-shadow var(--motion);
}
.tab:hover:not(:disabled) { color: var(--fg); }
.tab.active {
  background: var(--btn); color: var(--btn-ink);
  box-shadow: 0 1px 0 color-mix(in oklab, #fff 10%, transparent) inset;
}
.tab:disabled { opacity: 0.35; cursor: not-allowed; }
.tab:focus-visible { z-index: 1; }
.topbar-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.topbar-hint { font-size: var(--fs-xs); color: var(--fg-2); font-family: var(--mono); }

.content {
  min-height: 0; overflow: auto;
  position: relative;
  overscroll-behavior: contain;
}

/* ── transport (single status line) ──────────────────────── */
.transport {
  border-top: 1px solid var(--border);
  background: color-mix(in oklab, var(--panel) 92%, var(--led) 8%);
  min-height: var(--transport-h);
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--gutter-chrome);
  overflow-x: auto;
}
.transport-label {
  font-family: var(--mono); font-size: var(--fs-xs); font-weight: 800;
  letter-spacing: 0.12em; color: var(--btn-ink);
  text-transform: uppercase; white-space: nowrap;
  flex-shrink: 0;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--led);
  box-shadow: 0 0 0 2px var(--led-soft);
}
.transport-meters {
  flex: 1; min-width: 0;
  font-family: var(--mono); font-size: var(--fs-sm); color: var(--fg-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.3;
}
.transport-meters strong { color: var(--fg); font-weight: 700; }

/* ── compose ─────────────────────────────────────────────── */
.compose {
  min-height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 2.5rem var(--gutter);
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, var(--led-soft), transparent 55%),
    linear-gradient(180deg, color-mix(in oklab, var(--panel) 70%, transparent), transparent 45%),
    var(--bg);
}
.compose-card {
  width: min(560px, 100%);
  display: flex; flex-direction: column;
  gap: 1.5rem;
}
.compose-intro {
  display: flex; flex-direction: column;
  gap: 0.75rem;
}
.compose-card .eyebrow {
  font-family: var(--mono); font-size: var(--fs-xs); font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--led);
  margin: 0;
}
.compose-card h1 {
  margin: 0; font-size: var(--fs-xl); font-weight: 700;
  letter-spacing: -0.03em; line-height: 1.08; max-width: 12ch;
}
.compose-card h1 em { font-style: normal; color: var(--led); }
.compose-card .lead {
  margin: 0; color: var(--fg-2); font-size: var(--fs-base); max-width: 42ch;
  line-height: 1.55;
}
.compose-field {
  display: flex; flex-direction: column;
  gap: 0.5rem;
}
.compose-input {
  width: 100%; min-height: 112px; resize: vertical;
  padding: var(--space-3) var(--space-4);
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); color: var(--fg);
  line-height: 1.45;
  transition: border-color var(--motion), box-shadow var(--motion);
}
.compose-input::placeholder { color: var(--meta); }
.compose-input:hover { border-color: var(--muted); }
.compose-input:focus-visible {
  border-color: var(--led);
  box-shadow: var(--focus), 0 0 0 6px var(--led-soft);
}
.compose-input.invalid { border-color: var(--danger); }
.compose-error {
  display: none; color: var(--danger); font-size: var(--fs-sm);
}
.compose-error.show { display: block; }
.compose-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3); flex-wrap: wrap;
  margin-top: var(--space-1);
}
.compose-hint { font-size: var(--fs-xs); color: var(--meta); font-family: var(--mono); }
.compose-examples {
  display: flex; flex-direction: column;
  gap: var(--stack-tight);
  padding-top: var(--space-1);
  border-top: 1px solid var(--border);
}
.compose-examples-label {
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.compose-examples-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-height: 34px;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  background: var(--panel); border: 1px solid var(--border);
  font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2);
  transition: border-color var(--motion), color var(--motion), background var(--motion);
}
.chip:hover {
  border-color: color-mix(in oklab, var(--led) 40%, var(--border));
  color: var(--fg);
  background: color-mix(in oklab, var(--led) 6%, var(--panel));
}
.chip:focus-visible { box-shadow: var(--focus); }

/* ── arrangement / stages ────────────────────────────────── */
.trace-wrap {
  display: flex; flex-direction: column; gap: 0;
  min-height: 100%;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}
.arrangement-head {
  padding: 1.5rem var(--gutter) 0.75rem;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 0.75rem 1rem;
}
.arrangement-title {
  display: flex; flex-direction: column; gap: 0.5rem;
  min-width: 0; flex: 1 1 16rem;
}
.arrangement-head h2 {
  margin: 0; font-size: var(--fs-lg); font-weight: 700;
  letter-spacing: -0.03em;
}
.arrangement-bridge {
  margin: 0;
  max-width: 48ch;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: -0.01em;
  color: var(--fg-2);
}
.arrangement-bridge strong { color: var(--fg); font-weight: 700; }
/* Console meter plate for run status (not soft pill chips) */
.trace-status {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--track);
}
.trace-status .status-led {
  width: 6px;
  height: 6px;
  border-radius: 1px;
  background: currentColor;
  flex-shrink: 0;
  color: var(--border-strong);
}
.trace-status .status-led.badge-complete { color: var(--play); }
.trace-status .status-led.badge-running,
.trace-status .status-led.badge-accent { color: var(--led); }
.trace-status .status-led.badge-warnings { color: var(--warn); }
.trace-status .status-led.badge-error,
.trace-status .status-led.badge-cancelled { color: var(--danger); }
.trace-status .badge {
  border: none;
  background: transparent;
  padding: 0;
  border-radius: 0;
  letter-spacing: 0.05em;
  font-size: 12px;
}
.trace-status .badge-complete { color: var(--play); }
.trace-status .badge-running,
.trace-status .badge-accent { color: var(--led); }
.trace-status .badge-warnings { color: var(--warn); }
.trace-status .badge-error,
.trace-status .badge-cancelled { color: var(--danger); }
.trace-status [data-trace-hint] {
  color: var(--fg-2);
  font-weight: 500;
}
.trace-status [data-trace-hint]::before {
  content: "·";
  margin-right: 8px;
  color: var(--border-strong);
}
.trace-active-count { color: var(--led); font-weight: 700; }

/* Compact step strip — instrument current stage owns the amber */
.stage-ruler {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
  margin: 0 var(--gutter) 1rem;
  padding: 0.5rem 0.75rem;
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
}
/* Console segment chips (not soft SaaS pills): left LED + track body */
.stage {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
  min-width: 0;
  padding: 0 10px 0 8px;
  background: transparent;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  color: var(--muted);
  box-shadow: none;
  transition: background var(--motion), border-color var(--motion), color var(--motion), box-shadow var(--motion);
}
.stage-led {
  width: 3px;
  height: 14px;
  border-radius: 1px;
  background: var(--border-strong);
  flex-shrink: 0;
}
.stage.is-done {
  color: var(--fg-2);
  border-color: color-mix(in oklab, var(--play) 40%, var(--border));
  background: var(--track);
}
.stage.is-done .stage-led { background: var(--play); }
.stage.is-current {
  border-color: color-mix(in oklab, var(--led) 55%, transparent);
  background: var(--led);
  color: var(--btn-ink);
  font-weight: 700;
  box-shadow: 0 0 0 3px var(--led-soft), 0 1px 0 color-mix(in oklab, #fff 18%, transparent) inset;
}
.stage.is-current .stage-led {
  background: var(--btn-ink);
  opacity: 0.72;
}
.stage.is-pending { opacity: 0.45; }
.stage-name {
  font-size: var(--fs-sm);
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.stage.is-current .stage-name { font-weight: 700; }
.stage-meta {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
  opacity: 0.9;
}
.stage.is-current .stage-meta { color: var(--btn-ink); opacity: 0.75; }
.stage.is-done .stage-meta { color: var(--play); opacity: 1; }

/* Compact track rows — expand for detail */
.track-stack, .lanes {
  display: flex; flex-direction: column; gap: 0.5rem;
  padding: 0 var(--gutter) 2.5rem;
}
.lane {
  display: flex; flex-direction: column;
  background: var(--track);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  min-height: 0;
  transition: border-color var(--motion), background var(--motion), box-shadow var(--motion);
}
.lane.is-active {
  border-color: color-mix(in oklab, var(--led) 55%, var(--border));
  background: var(--track-armed);
  box-shadow: inset 3px 0 0 var(--led), 0 0 0 1px var(--led-soft);
}
.lane.is-error { border-color: color-mix(in oklab, var(--danger) 45%, var(--border)); }
/* Two-row multitrack channel head — square arm bar, not soft orb accordion */
.lane-head {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  grid-template-rows: auto auto;
  column-gap: 10px;
  row-gap: 2px;
  align-items: center;
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  text-align: left;
  cursor: pointer;
  color: inherit;
  background: transparent;
  border: 0;
}
.lane-head:hover { background: color-mix(in oklab, var(--bg) 40%, transparent); }
.lane-head:focus-visible { box-shadow: inset 0 0 0 2px var(--led-glow); outline: none; }
.lane-top {
  grid-column: 1;
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lane-led {
  width: 4px;
  height: 22px;
  border-radius: 1px;
  background: var(--meta);
  flex-shrink: 0;
  box-shadow: none;
}
.lane.is-active .lane-led {
  background: var(--led);
  box-shadow: 0 0 0 3px var(--led-soft);
  animation: pulse-led 1.2s ease-in-out infinite;
}
.lane.is-complete .lane-led { background: var(--play); animation: none; box-shadow: none; }
.lane.is-error .lane-led { background: var(--danger); animation: none; box-shadow: none; }
.lane-code {
  grid-column: 3;
  grid-row: 1 / span 2;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
  align-self: center;
}
.lane.is-active .lane-code { color: var(--led); }
.lane-name {
  grid-column: 2;
  grid-row: 1;
  font-weight: 700;
  font-size: 14px;
  color: var(--fg);
  min-width: 0;
  letter-spacing: -0.015em;
}
.lane-summary {
  grid-column: 2;
  grid-row: 2;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--meta);
  margin-left: 0;
  text-transform: none;
  letter-spacing: 0.01em;
  justify-self: start;
}
.lane.is-active .lane-summary { color: var(--led); }
.lane-body {
  display: none;
  border-top: 1px solid var(--border);
}
.lane.is-open .lane-body { display: block; }
.lane-entries {
  padding: var(--space-2) var(--space-3) var(--space-3);
  overflow: auto; max-height: 180px;
  display: flex; flex-direction: column; gap: 0.125rem;
  font-size: var(--fs-sm);
}
.lane-waiting {
  color: var(--meta); font-size: var(--fs-sm);
  padding: var(--space-3) var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-1);
}
.lane-waiting strong { color: var(--fg-2); font-weight: 600; }
.lane-live-bar {
  display: none;
  height: 2px;
  background: var(--led);
  flex-shrink: 0;
}
.lane.is-active .lane-live-bar { display: block; }
.trace-entry {
  display: grid; grid-template-columns: 52px 1fr; gap: var(--space-2);
  padding: var(--space-2); border-radius: var(--radius-sm);
  text-align: left; color: var(--fg-2);
  width: 100%;
  transition: background var(--motion), color var(--motion);
}
.trace-entry:hover { background: color-mix(in oklab, var(--bg) 50%, transparent); color: var(--fg); }
.trace-entry:focus-visible { box-shadow: var(--focus); }
.trace-entry.error, .trace-entry.is-error { color: var(--danger); }
.trace-entry-time {
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta); padding-top: 2px;
}
.trace-entry-text { line-height: 1.4; }

.degraded-banner {
  margin: 0 var(--gutter) var(--stack-group);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--border));
  background: color-mix(in oklab, var(--warn) 8%, var(--panel));
  display: flex; gap: var(--space-3); align-items: flex-start;
  font-size: var(--fs-sm);
}
.panel .degraded-banner {
  margin-left: 0;
  margin-right: 0;
}
.degraded-banner strong { display: block; color: var(--warn); margin-bottom: var(--space-1); }
.degraded-banner p { margin: 0; color: var(--fg-2); }
.degraded-banner svg { width: 18px; height: 18px; color: var(--warn); flex-shrink: 0; margin-top: 1px; }

/* ── report ──────────────────────────────────────────────── */
/* Outer panel is full-bleed; measure + gutters live on panel-inner only */
.report,
.panel.report {
  max-width: none;
  margin: 0;
  padding: 0;
}
.panel { min-height: 100%; }
.panel .panel-inner,
.panel-inner.report {
  max-width: 720px;
  margin: 0 auto;
  padding: 2rem var(--gutter) 2.5rem;
}
.report-header {
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 0.75rem;
}
.report-header .eyebrow {
  font-family: var(--mono); font-size: var(--fs-xs); font-weight: 800;
  color: var(--led);
  text-transform: uppercase; letter-spacing: 0.1em; margin: 0;
}
.report-header h1 {
  margin: 0; font-size: var(--fs-xl);
  font-weight: 700; letter-spacing: -0.03em; line-height: 1.12;
}
.report-meta {
  margin: 0; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4);
  font-family: var(--mono); font-size: var(--fs-xs); font-weight: 600; color: var(--muted);
}
.report-body {
  font-size: var(--fs-base); line-height: 1.65; color: var(--fg-2);
  max-width: 68ch;
}
.report-body h2 {
  margin: 1.75em 0 0.5em; font-size: var(--fs-lg); font-weight: 700;
  color: var(--fg); letter-spacing: -0.02em;
}
.report-body h2:first-child { margin-top: 0; }
.report-body h3 {
  margin: 1.25em 0 0.4em; font-size: var(--fs-md); font-weight: 600; color: var(--fg);
}
.report-body p { margin: 0 0 0.85em; }
.report-body ul { margin: 0 0 0.85em; padding-left: 1.2em; }
.report-body li { margin: 0.3em 0; }
.report-body table {
  width: 100%; border-collapse: collapse; margin: 0.8em 0 1.2em;
  font-size: var(--fs-sm);
}
.report-body th, .report-body td {
  text-align: left; padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border);
}
.report-body th { color: var(--fg); font-weight: 600; background: var(--panel); }
.report-body .callout {
  margin: 1.5em 0;
  padding: var(--space-4);
  border-radius: var(--radius-md);
  background: color-mix(in oklab, var(--led) 10%, var(--panel));
  border: 1px solid color-mix(in oklab, var(--led) 35%, var(--border));
  color: var(--fg);
  box-shadow: inset 3px 0 0 var(--led);
}
.report-body .callout strong {
  color: var(--led);
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: var(--fs-xs);
  display: block;
  margin-bottom: var(--space-2);
}
.sources {
  margin-top: 2.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}
.sources-list { display: flex; flex-direction: column; gap: var(--space-2); }
.source-item {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1);
  width: 100%; text-align: left;
  padding: var(--space-3); border-radius: var(--radius-md);
  background: var(--panel); border: 1px solid var(--border);
  color: var(--fg-2);
  transition: border-color var(--motion), color var(--motion), background var(--motion);
}
.source-item:hover { border-color: var(--muted); color: var(--fg); background: var(--track); }
.source-item:focus-visible { box-shadow: var(--focus); }
.source-title { font-size: var(--fs-sm); font-weight: 500; color: inherit; }
.source-agents {
  display: flex; flex-wrap: wrap; gap: var(--space-1);
}
.source-agents span {
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta);
  padding: 1px 6px; border-radius: var(--radius-pill); border: 1px solid var(--border);
}
.source-agents-modal { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0; }
.source-modal-url {
  word-break: break-all;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--muted);
  margin: 0 0 var(--space-4);
}

/* ── overlays ────────────────────────────────────────────── */
.drawer-backdrop, .modal-backdrop {
  position: fixed; inset: 0;
  background: color-mix(in oklab, #000 55%, transparent);
  opacity: 0; pointer-events: none;
  transition: opacity var(--motion);
  z-index: calc(var(--z-drawer) - 1);
}
.drawer-backdrop.open, .modal-backdrop.open {
  opacity: 1; pointer-events: auto;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(400px, 100%);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1);
  z-index: var(--z-drawer);
  display: flex; flex-direction: column;
  overscroll-behavior: contain;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--space-3); padding: var(--gutter-chrome);
  border-bottom: 1px solid var(--border);
}
.drawer-head h2 { margin: 0; font-size: var(--fs-md); }
.drawer-sub { margin-top: var(--space-1); font-size: var(--fs-sm); color: var(--muted); }
.drawer-body {
  padding: var(--gutter-chrome); overflow: auto; flex: 1;
  font-size: var(--fs-sm); color: var(--fg-2);
}
.drawer-body dl { margin: 0; display: grid; gap: var(--space-3); }
.drawer-body dt {
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-1);
}
.drawer-body dd { margin: 0; color: var(--fg); line-height: 1.45; }

.modal-backdrop { z-index: var(--z-modal); display: grid; place-items: center; padding: var(--gutter-chrome); }
.modal {
  width: min(440px, 100%);
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: 0 16px 48px color-mix(in oklab, #000 45%, transparent);
}
.modal h3 { margin: 0 0 var(--space-2); font-size: var(--fs-lg); letter-spacing: -0.02em; }
.modal p { margin: 0 0 var(--space-4); color: var(--fg-2); font-size: var(--fs-sm); line-height: 1.5; }
.modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); flex-wrap: wrap; }

.toast {
  position: fixed; bottom: calc(var(--transport-h) + var(--space-4)); left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--track-armed); color: var(--fg);
  border: 1px solid var(--border-strong);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--fs-sm); font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: opacity var(--motion), transform var(--motion);
  z-index: var(--z-toast);
  max-width: min(420px, 92vw); text-align: center;
  box-shadow: 0 8px 24px color-mix(in oklab, #000 35%, transparent);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-destructive {
  border-color: color-mix(in oklab, var(--danger) 50%, var(--border));
  color: color-mix(in oklab, var(--danger) 70%, #fff);
}


.badge-accent { color: var(--led); border-color: color-mix(in oklab, var(--led) 35%, transparent); }
.badge-muted { color: var(--muted); }
.badge-danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); }
.lane.is-done { opacity: 0.95; }
.lane.is-waiting { opacity: 0.8; }
.trace-entry.is-new { background: color-mix(in oklab, var(--led) 8%, transparent); }
.drawer-section { margin-bottom: var(--space-4); }
.drawer-section label {
  display: block; font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2);
}
.drawer-pre {
  margin: 0; padding: var(--space-3); background: var(--bg); border-radius: var(--radius-sm);
  border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word;
  font-family: var(--mono); font-size: var(--fs-sm); color: var(--fg); line-height: 1.45;
}

.sources-toggle {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3); padding: var(--space-3) 0;
  color: var(--fg); font-weight: 600; font-size: var(--fs-md);
  border-radius: var(--radius-sm);
  transition: color var(--motion);
}
.sources-toggle:hover { color: var(--led); }
.sources-toggle:focus-visible { box-shadow: var(--focus); }
.sources-toggle-label { display: inline-flex; align-items: center; gap: var(--space-2); }
.sources-toggle-label svg { width: 14px; height: 14px; transition: transform var(--motion); }
.sources.open .sources-toggle-label svg { transform: rotate(90deg); }
.sources-count { font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta); font-weight: 500; }
.sources .sources-list { display: none; flex-direction: column; gap: var(--space-2); }
.sources.open .sources-list { display: flex; }
.source-url {
  display: block; margin-top: 2px;
  font-family: var(--mono); font-size: var(--fs-xs); color: var(--meta);
  word-break: break-all;
}
.table-scroll { overflow-x: auto; margin: 0.8em 0 1.2em; }
.table-scroll table { margin: 0; }

/* ── responsive ──────────────────────────────────────────── */
@media (max-width: 860px) {
  :root {
    --gutter: var(--space-4);
    --gutter-chrome: var(--space-3);
  }
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: min(var(--sidebar-w), 88vw);
    transform: translateX(-105%);
    transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar-scrim { display: block; }
  .sidebar-scrim[hidden] { display: none; }
  .menu-toggle { display: inline-flex; }
  .topbar-query { max-width: min(18ch, 40vw); flex: 0 1 auto; }
  .compose { padding: 1.5rem var(--gutter); }
  .compose-card h1 { max-width: none; }
  .compose-card { gap: 1rem; }
  .lane-summary { max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .session-dot.running, .lane.is-active .lane-led { animation: none; }
  .btn-primary:hover, .btn-primary:active { transform: none; }
}

  </style>
</head>
<body>

  <div class="app" id="app" data-od-id="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Research takes" data-od-id="sidebar">
      <div class="sidebar-head">
        <div class="brand-row">
          <div class="brand" data-od-id="brand">
            <span class="brand-mark">MT</span>
            <span class="brand-text">
              <span class="brand-name">Research</span>
              <span class="brand-sub">Multitrack</span>
            </span>
          </div>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btn-new-research" data-od-id="btn-new-research" title="Arm a new research take">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          New Take
        </button>
        <div class="field-search">
          <input type="search" id="session-filter" placeholder="Filter takes…" aria-label="Filter takes by query" data-od-id="session-filter" />
        </div>
      </div>
      <div class="session-list" id="session-list" role="listbox" aria-label="Past takes" data-od-id="session-list"></div>
      <div class="sidebar-foot">DEMO desk</div>
    </aside>

    <main class="main" id="main" data-od-id="main">
      <header class="topbar" id="topbar" data-od-id="topbar">
        <div class="topbar-left">
          <button type="button" class="btn btn-ghost menu-toggle" id="menu-toggle" aria-label="Open takes sidebar" aria-controls="sidebar" aria-expanded="false" data-od-id="menu-toggle">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="topbar-query" id="topbar-query" data-od-id="topbar-query">—</div>
          <div class="tabs" id="view-tabs" role="tablist" aria-label="Session views" data-od-id="view-tabs">
            <button type="button" class="tab" role="tab" data-view="trace" id="tab-trace" aria-controls="content">Stages</button>
            <button type="button" class="tab" role="tab" data-view="report" id="tab-report" aria-controls="content">Report</button>
          </div>
        </div>
        <div class="topbar-actions" id="topbar-actions" data-od-id="topbar-actions"></div>
      </header>

      <div class="content" id="content" data-od-id="content" role="region" aria-label="Session workspace"></div>

      <footer class="transport" id="transport" aria-label="DEMO status" data-od-id="transport">
        <div class="transport-label" title="Synthetic demo metrics — not production telemetry">DEMO</div>
        <div class="transport-meters" id="transport-meters" data-od-id="transport-primary"></div>
      </footer>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title">Track action</h2>
        <div class="drawer-sub" id="drawer-sub"></div>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="drawer-close" aria-label="Close drawer">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-backdrop" id="source-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title">
      <h3 id="source-modal-title">Source</h3>
      <p id="source-modal-url" class="source-modal-url"></p>
      <div id="source-modal-agents" class="source-agents source-agents-modal"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="source-modal-close">Close</button>
        <a class="btn btn-primary" id="source-modal-open" href="#" target="_blank" rel="noopener noreferrer">Open source</a>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="cancel-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancel-modal-title">
      <h3 id="cancel-modal-title">Stop this take?</h3>
      <p>Armed tracks will halt. No report will be generated for this run.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-modal-keep">Keep running</button>
        <button type="button" class="btn btn-danger" id="cancel-modal-confirm">Stop research</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-od-id="toast"></div>

  <script>
(function () {
  "use strict";

      // Research stage is the only meta that must stay visible (fan-out story).
      let meta = "";
      if (st.id === "research" && m.fanOut) meta = `×${m.fanOut}`;
      else if (st.id === "verify" && m.verdict !== "—") meta = m.verdict;
      return `<div class="stage ${cls}" role="listitem">
        <span class="stage-led" aria-hidden="true"></span>
        <span class="stage-name">${st.name}</span>
        ${meta ? `<span class="stage-meta">${escapeHtml(meta)}</span>` : ""}
      </div>`;
    }).join("") + `</div>`;
  }

  /* ─── render sidebar ──────────────────────────────────────────── */
  function renderSidebar() {
    const list = $("#session-list");
    const filterEl = $("#session-filter");
    const filterWrap = filterEl && filterEl.closest(".field-search");
    const filter = (filterEl && filterEl.value || "").trim().toLowerCase();
    const filtered = sessions.filter((s) => !filter || s.query.toLowerCase().includes(filter));

    if (filterWrap) filterWrap.classList.toggle("is-hidden", sessions.length < 5 && !filter);

    if (!filtered.length) {
      list.innerHTML = `<div class="sidebar-empty"><strong>No sessions</strong>${filter ? "Try a different filter." : "Start a new take."}</div>`;
      return;
    }

    list.innerHTML =
      filtered
        .map((s) => {
          const st = stateLabel(s.state);
          const active = s.id === activeId && !composeMode ? " active" : "";
          return `
          <button type="button" class="session-item${active}" role="option" aria-selected="${s.id === activeId && !composeMode}" data-id="${s.id}" title="${escapeAttr(s.query)}">
            <span class="session-dot ${st.dot}" aria-hidden="true"></span>
            <span>
              <span class="session-title">${escapeHtml(truncate(s.query, 72))}</span>
              <span class="session-meta">${st.text} · ${fmtRelative(s.createdAt)}</span>
            </span>
          </button>`;
        })
        .join("");
  }

  /* ─── topbar ──────────────────────────────────────────────────── */
  function renderTopbar() {
    const s = activeSession();
    const tabs = $("#view-tabs");
    const actions = $("#topbar-actions");
    const q = $("#topbar-query");

    if (composeMode || !s) {
      q.textContent = "New take";
      tabs.classList.add("hidden");
      actions.innerHTML = "";
      return;
    }

    tabs.classList.remove("hidden");
    q.textContent = s.query;
    q.title = s.query;

    $$(".tab", tabs).forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.view === view);
      tab.setAttribute("aria-selected", tab.dataset.view === view ? "true" : "false");
      // Disable report tab if no report yet
      if (tab.dataset.view === "report") {
        const hasReport = s.state === "complete" || s.state === "warnings";
        tab.disabled = !hasReport;
        tab.setAttribute("aria-disabled", hasReport ? "false" : "true");
        tab.removeAttribute("style");
      } else {
        tab.disabled = false;
        tab.setAttribute("aria-disabled", "false");
      }
    });

    if (s.state === "running") {
      actions.innerHTML = `
        <button type="button" class="btn btn-secondary btn-danger-ghost" id="btn-stop" data-od-id="btn-stop">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/></svg>
          Stop
        </button>`;
      $("#btn-stop").onclick = openCancelModal;
    } else if (view === "report" && (s.state === "complete" || s.state === "warnings")) {
      // Tabs own Stages/Report; export actions only here.
      actions.innerHTML = `
        <button type="button" class="btn btn-secondary" id="btn-copy" data-od-id="btn-copy">Copy</button>
        <button type="button" class="btn btn-primary" id="btn-md" data-od-id="btn-md">.md</button>`;
      $("#btn-copy").onclick = copyReport;
      $("#btn-md").onclick = downloadMarkdown;
    } else if (view === "trace" && (s.state === "complete" || s.state === "warnings")) {
      actions.innerHTML = `
        <button type="button" class="btn btn-primary" id="btn-to-report" data-od-id="btn-to-report">View report</button>`;
      $("#btn-to-report").onclick = () => { view = "report"; render(); };
    } else if (s.state === "cancelled") {
      actions.innerHTML = `<span class="topbar-hint">Stopped — no report</span>`;
    } else {
      actions.innerHTML = "";
    }
  }

  /* ─── content ─────────────────────────────────────────────────── */
  function renderContent() {
    const root = $("#content");
    if (composeMode) {
      root.innerHTML = renderCompose();
      wireCompose();
      return;
    }
    const s = activeSession();
    if (!s) {
      composeMode = true;
      return renderContent();
    }
    if (view === "report" && (s.state === "complete" || s.state === "warnings")) {
      root.innerHTML = renderReport(s);
      wireReport(s);
    } else {
      view = "trace";
      root.innerHTML = renderTrace(s);
      wireTrace(s);
    }
  }

  function wireCompose() {
    const input = $("#compose-input");
    const submit = $("#btn-submit");
    const err = $("#compose-error");
    input.focus();
    const clearError = () => {
      input.classList.remove("invalid");
      input.setAttribute("aria-invalid", "false");
      if (err) {
        err.textContent = "";
        err.classList.remove("show");
      }
    };
    submit.onclick = () => submitQuery(input.value);
    input.addEventListener("input", clearError);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitQuery(input.value);
      }
    });
    $$(".chip").forEach((c) => {
      c.onclick = () => {
        input.value = c.dataset.q;
        clearError();
        input.focus();
      };
    });
  }

  function wireReport(s) {
    const toggle = $("#sources-toggle");

      toggle.setAttribute("aria-expanded", open ? "true" : "false");

    // Horizontal scroll wrappers for tables (mobile)

  function emptyLaneMessage(s, name, laneState) {
    if (s.state === "cancelled") {
      return `<div class="lane-waiting"><strong>No activity</strong>Stopped before this lane started</div>`;
    }
    if (s.state === "running" && laneState === "waiting") {
      return `<div class="lane-waiting"><strong>Queued</strong>Waiting for upstream work…</div>`;
    }
    if (laneState === "waiting" || !laneState) {
      return `<div class="lane-waiting"><strong>Idle</strong>No entries in this lane</div>`;
    }
    return `<div class="lane-waiting">Waiting…</div>`;
  }

  function lanePresentation(s, name) {
    const running = s.state === "running";
    const finishing = !!s._finishing;
    const entries = (s.lanes && s.lanes[name]) || [];
    const last = entries[entries.length - 1];
    let laneState = "waiting";
    if (running || finishing) {
      if (s._laneState && s._laneState[name]) laneState = s._laneState[name];
      else if (entries.length) laneState = "active";
    } else if (last && last.error) laneState = "error";
    else if (entries.length) laneState = "complete";
    else if (s.state === "cancelled") laneState = "waiting";

    let badgeCls = "badge-muted";
    let badgeText = "Waiting";
    if (laneState === "active") { badgeCls = "badge-accent"; badgeText = "Active"; }
    if (laneState === "complete") {
      badgeCls = "badge-muted";
      badgeText = running || finishing ? "Done" : "Complete";
    }
    if (laneState === "error") { badgeCls = "badge-danger"; badgeText = "Error"; }
    if (s.state === "cancelled") {
      badgeCls = "badge-muted";
      badgeText = entries.length ? "Stopped" : "Idle";
    }

    let laneMod = "";
    if ((running || finishing) && laneState === "active") laneMod = "is-active";
    else if ((running || finishing) && laneState === "complete") laneMod = "is-done";
    else if ((running || finishing) && laneState === "waiting") laneMod = "is-waiting";
    else if (s.state === "cancelled" && !entries.length) laneMod = "is-waiting";
    else if (!running && !finishing && entries.length) laneMod = "is-done";

    return { laneState, badgeCls, badgeText, laneMod, entries };
  }

  function renderEntryHtml(name, e, i, now) {
    const isNew = e._at && now - e._at < 750;
    return `
            <button type="button" class="trace-entry${e.error ? " error" : ""}${isNew ? " is-new" : ""}" data-agent="${escapeAttr(name)}" data-idx="${i}">
              <div class="trace-entry-time">${escapeHtml(e.t)}</div>
              <div class="trace-entry-text">${escapeHtml(e.text)}</div>
            </button>`;
  }


  function laneIsOpen(name, laneState, running) {
    if (openLanes[name] === true) return true;
    if (openLanes[name] === false) return false;
    // Auto-open only the active track during a run; keep finished takes collapsed.
    return !!(running && laneState === "active");
  }

  function renderTrace(s) {
    const st = stateLabel(s.state);
    const running = s.state === "running";
    const finishing = !!s._finishing;
    const activeCount = countActiveLanes(s._laneState);
    const now = Date.now();
    const hint = traceHintText(s, activeCount);

    const degraded = s.degraded
      ? `<div class="degraded-banner" role="status">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 7v4M10 14h.01M9.1 3.5l-7.2 12.4a1 1 0 00.87 1.5h14.46a1 1 0 00.87-1.5L10.9 3.5a1 1 0 00-1.8 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div><strong>Degraded take</strong><p>${escapeHtml(s.degradedNote || "One or more tracks failed.")}</p></div>
        </div>`
      : "";

    const lanes = AGENTS.map((name) => {
      const { laneState, badgeText, laneMod, entries } = lanePresentation(s, name);
      const isOpen = laneIsOpen(name, laneState, running || finishing);
      const body =
        entries.length === 0
          ? emptyLaneMessage(s, name, laneState)
          : entries.map((e, i) => renderEntryHtml(name, e, i, now)).join("");
      const ledCls = laneState === "active" ? "is-active" : laneState === "error" ? "is-error" : laneState === "complete" ? "is-complete" : "";
      const summary = entries.length
        ? `${entries.length} step${entries.length === 1 ? "" : "s"} · ${badgeText}`
        : badgeText;
      return `
        <section class="lane${laneMod ? " " + laneMod : ""}${ledCls ? " " + ledCls : ""}${isOpen ? " is-open" : ""}" data-od-id="lane-${name.toLowerCase()}" data-agent="${escapeAttr(name)}" data-lane-state="${escapeAttr(laneState)}">
          <div class="lane-live-bar" aria-hidden="true"></div>

          <button type="button" class="lane-head" data-lane-toggle="${escapeAttr(name)}" aria-expanded="${isOpen ? "true" : "false"}">
            <span class="lane-top">
              <span class="lane-led" aria-hidden="true"></span>
            </span>
            <span class="lane-name">${escapeHtml(name)}</span>
            <span class="lane-summary" data-lane-badge>${escapeHtml(summary)}</span>
            <span class="lane-code">T${AGENT_CODES[name] || ""}</span>
          </button>

          <div class="lane-body">
            <div class="lane-entries" data-lane-scroll="${escapeAttr(name)}">${body}</div>
          </div>
        </section>`;
    }).join("");

    const wrapClass = [
      "trace-wrap",
      running ? "is-running" : "",
      finishing ? "is-finishing is-running" : ""
    ].filter(Boolean).join(" ");

    return `
      <div class="${wrapClass}" data-od-id="trace-view">
        <div class="arrangement-head">
          <div class="arrangement-title">
            <h2>Stages</h2>
            <p class="arrangement-bridge">Pipeline steps above. <strong>Research</strong> runs parallel tracks below — expand a track for detail.</p>
          </div>
          <div class="trace-status" role="status" aria-live="polite" aria-atomic="true">
            <span class="status-led ${finishing ? "badge-accent" : st.cls}" aria-hidden="true"></span>
            <span class="badge ${finishing ? "badge-accent" : st.cls}" data-trace-badge>${finishing ? "Finalizing" : st.text}</span>
            <span data-trace-hint class="${running && activeCount ? "trace-active-count" : ""}">${escapeHtml(hint)}</span>
          </div>
        </div>
        ${degraded}
        ${renderStageRuler(s)}
        <div class="track-stack lanes" id="lanes" data-od-id="track-stack">${lanes}</div>
      </div>`;
  }

  function bindTraceEntry(el, s) {
    el.onclick = () => {
      const agent = el.dataset.agent;
      const idx = +el.dataset.idx;
      const entry = s.lanes[agent] && s.lanes[agent][idx];
      if (entry) openDrawer(agent, idx, entry, s);
    };
  }

  function wireTrace(s) {
    $$(".trace-entry").forEach((el) => bindTraceEntry(el, s));
    $$("[data-lane-toggle]").forEach((btn) => {
      btn.onclick = () => {
        const name = btn.dataset.laneToggle;
        const lane = btn.closest(".lane");
        const next = !(lane && lane.classList.contains("is-open"));
        openLanes[name] = next;
        if (lane) {
          lane.classList.toggle("is-open", next);
          btn.setAttribute("aria-expanded", next ? "true" : "false");
        }
      };
    });
    $$("[data-lane-scroll]").forEach((body) => {
      if (body.dataset.scrollWired === "1") return;
      body.dataset.scrollWired = "1";
      const name = body.dataset.laneScroll;
      body.addEventListener("scroll", () => {
        const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
        autoScrollPaused[name] = !nearBottom;
      });
    });
    $$("[data-lane-scroll]").forEach((body) => {
      const name = body.dataset.laneScroll;
      if (!autoScrollPaused[name]) body.scrollTop = body.scrollHeight;
    });
  }

  /** Patch Stages view in place — avoids full-panel re-render / animation restarts. */
  function patchTrace(s) {
    const wrap = document.querySelector('[data-od-id="trace-view"]');
    if (!wrap) return false;

    const running = s.state === "running";
    const finishing = !!s._finishing;
    const activeCount = countActiveLanes(s._laneState);
    const st = stateLabel(s.state);
    const now = Date.now();

    wrap.classList.toggle("is-running", running || finishing);
    wrap.classList.toggle("is-finishing", finishing);

    const badge = wrap.querySelector("[data-trace-badge]");
    const badgeCls = finishing ? "badge-accent" : st.cls;
    if (badge) {
      badge.className = "badge " + badgeCls;
      badge.textContent = finishing ? "Finalizing" : st.text;
    }
    const statusLed = wrap.querySelector(".trace-status .status-led");
    if (statusLed) statusLed.className = "status-led " + badgeCls;
    const hintEl = wrap.querySelector("[data-trace-hint]");
    if (hintEl) {
      const hint = traceHintText(s, activeCount);
      hintEl.textContent = hint;
      hintEl.classList.toggle("trace-active-count", !!(running && activeCount));
    }

    const ruler = wrap.querySelector(".stage-ruler");
    if (ruler) {
      const tmp = document.createElement("div");
      tmp.innerHTML = renderStageRuler(s);
      ruler.replaceWith(tmp.firstElementChild);
    }

    AGENTS.forEach((name) => {
      const { laneState, badgeText, laneMod, entries } = lanePresentation(s, name);
      const lane = wrap.querySelector('.lane[data-agent="' + CSS.escape(name) + '"]');
      if (!lane) return;

      lane.classList.remove("is-active", "is-done", "is-waiting", "is-complete", "is-error", "is-open");
      if (laneMod) lane.classList.add(laneMod);
      if (laneState === "active") lane.classList.add("is-active");
      if (laneState === "complete") lane.classList.add("is-complete");
      if (laneState === "error") lane.classList.add("is-error");
      lane.dataset.laneState = laneState;

      const isOpen = laneIsOpen(name, laneState, running || finishing);
      lane.classList.toggle("is-open", isOpen);
      const head = lane.querySelector("[data-lane-toggle]");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");

      const laneBadge = lane.querySelector("[data-lane-badge]");
      if (laneBadge) {
        laneBadge.textContent = entries.length
          ? entries.length + " step" + (entries.length === 1 ? "" : "s") + " · " + badgeText
          : badgeText;
      }

      const body = lane.querySelector("[data-lane-scroll]");
      if (!body) return;

      if (entries.length === 0) {
        if (!body.querySelector(".lane-waiting") || body.querySelectorAll(".trace-entry").length) {
          body.innerHTML = emptyLaneMessage(s, name, laneState);
        }
        return;
      }

      if (body.querySelector(".lane-waiting")) body.innerHTML = "";

      const existing = body.querySelectorAll(".trace-entry").length;
      for (let i = existing; i < entries.length; i++) {
        const tmp = document.createElement("div");
        tmp.innerHTML = renderEntryHtml(name, entries[i], i, now).trim();
        const btn = tmp.firstElementChild;
        if (btn) {
          bindTraceEntry(btn, s);
          body.appendChild(btn);
        }
      }

      body.querySelectorAll(".trace-entry").forEach((el, i) => {
        const e = entries[i];
        if (!e) return;
        const isNew = e._at && now - e._at < 750;
        el.classList.toggle("is-new", !!isNew);
        el.classList.toggle("error", !!e.error);
      });

      if (!autoScrollPaused[name]) body.scrollTop = body.scrollHeight;
    });

    renderTransport();
    return true;
  }

  /* ─── drawer ──────────────────────────────────────────────────── */
  function openDrawer(agent, idx, entry, session) {
    lastFocusEl = document.activeElement;
    drawerEntry = { agent, idx, entry };
    $("#drawer-title").textContent = entry.text;
    $("#drawer-sub").textContent = `${agent} · step ${idx + 1} of ${session.lanes[agent].length} · ${entry.t}`;
    $("#drawer-body").innerHTML = `
      <div class="drawer-section">
        <label>Agent</label>
        <div><span class="badge badge-muted">${escapeHtml(agent)}</span>${entry.error ? ' <span class="badge badge-danger">Error</span>' : ""}</div>
      </div>
      <div class="drawer-section">
        <label>Input</label>
        <pre class="drawer-pre">${escapeHtml(entry.input || "—")}</pre>
      </div>
      <div class="drawer-section">
        <label>Output</label>
        <pre class="drawer-pre">${escapeHtml(entry.output || "—")}</pre>
      </div>`;
    $("#drawer").classList.add("open");
    $("#drawer-backdrop").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
    $("#drawer-backdrop").setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#drawer"));
    $("#drawer-close").focus();
  }

  function closeDrawer() {
    if (!$("#drawer").classList.contains("open")) return;
    $("#drawer").classList.remove("open");
    $("#drawer-backdrop").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#drawer-backdrop").setAttribute("aria-hidden", "true");
    drawerEntry = null;
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  /* ─── source modal ────────────────────────────────────────────── */
  function openSourceModal(src) {
    lastFocusEl = document.activeElement;
    $("#source-modal-title").textContent = src.title;
    const urlEl = $("#source-modal-url");
    if (urlEl) urlEl.textContent = src.url;
    $("#source-modal-agents").innerHTML = (src.agents || [])
      .map((a) => `<span class="badge badge-muted">${escapeHtml(a)}</span>`)
      .join("");
    const link = $("#source-modal-open");
    link.href = src.url;
    $("#source-modal").classList.add("open");
    $("#source-modal").setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#source-modal .modal") || $("#source-modal"));
    $("#source-modal-close").focus();
  }

  function closeSourceModal() {
    if (!$("#source-modal").classList.contains("open")) return;
    $("#source-modal").classList.remove("open");
    $("#source-modal").setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  /* ─── actions ─────────────────────────────────────────────────── */
  function copyReport() {
    const s = activeSession();
    if (!s || !s.report) return;
    const text = reportToMarkdown(s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast("Report copied"),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Report copied");
    } catch {
      showToast("Copy failed");
    }
    ta.remove();
  }

  function downloadMarkdown() {
    const s = activeSession();
    if (!s || !s.report) return;
    const md = reportToMarkdown(s);
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slugify(s.report.title) + ".md";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
    showToast("Markdown downloaded");
  }

  function reportToMarkdown(s) {
    const r = s.report;
    const tmp = document.createElement("div");
    tmp.innerHTML = r.html;
    let body = "";
    tmp.childNodes.forEach((node) => {
      if (node.nodeType !== 1) return;
      const tag = node.tagName.toLowerCase();
      if (tag === "h2") body += `\n## ${node.textContent.trim()}\n\n`;
      else if (tag === "h3") body += `\n### ${node.textContent.trim()}\n\n`;
      else if (tag === "p") body += `${node.textContent.trim()}\n\n`;
      else if (tag === "div") body += `> ${node.textContent.trim()}\n\n`;
      else if (tag === "ul") {
        node.querySelectorAll("li").forEach((li) => {
          body += `- ${li.textContent.trim()}\n`;
        });
        body += "\n";
      } else if (tag === "table") {
        const rows = [...node.querySelectorAll("tr")];
        rows.forEach((tr, i) => {
          const cells = [...tr.children].map((c) => c.textContent.trim());
          body += `| ${cells.join(" | ")} |\n`;
          if (i === 0) body += `| ${cells.map(() => "---").join(" | ")} |\n`;
        });
        body += "\n";
      }
    });
    let sources = "\n## Sources\n\n";
    (r.sources || []).forEach((src) => {
      sources += `- [${src.title}](${src.url}) — ${src.agents.join(", ")}\n`;
    });
    const warn = s.degraded ? `\n> **Warning:** ${s.degradedNote}\n` : "";
    return `# ${r.title}\n\n*Query:* ${s.query}\n${warn}\n${body}${sources}`;
  }

  function submitQuery(raw) {
    const q = (raw || "").trim();
    const input = $("#compose-input");
    const err = $("#compose-error");
    if (!q) {
      if (input) {
        input.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
        input.focus();
        if (err) {
          err.textContent = "Enter a research query to run the agent graph.";
          err.classList.add("show");
        }
        showToast("Enter a research query");
      }
      return;
    }
    const id = "s" + Date.now();
    const now = new Date();
    const session = {
      id,
      query: q,
      state: "running",
      createdAt: now.toISOString(),
      duration: "0s",
      degraded: false,
      report: null,
      lanes: { Analyst: [], Researcher: [], "Fact-checker": [], Synthesizer: [] },
      _laneState: { Analyst: "waiting", Researcher: "waiting", "Fact-checker": "waiting", Synthesizer: "waiting" },
      _start: Date.now()
    };
    sessions.unshift(session);
    activeId = id;
    composeMode = false;
    view = "trace";
    render();
    simulateRun(session);
  }

  function simulateRun(session) {
    clearInterval(runTimer);
    if (session._finishTimer) {
      clearTimeout(session._finishTimer);
      session._finishTimer = null;
    }

    const script = [
      { at: 350, agent: "Analyst", text: "Parsed query into research objectives", input: session.query, output: "Objectives extracted; domain classified as enterprise research." },
      { at: 480, agent: "Researcher", text: "Issued web & document retrieval", input: "Primary entities from query", output: "Retrieval fan-out started across public docs and filings." },
      { at: 1100, agent: "Analyst", text: "Drafted evaluation criteria", input: "Objectives", output: "Weighted criteria drafted for scoring." },
      { at: 1450, agent: "Researcher", text: "Ranked sources by relevance", input: "Raw retrieval set", output: "Top sources retained for fact-checking." },
      { at: 1900, agent: "Fact-checker", text: "Validating primary claims", input: "Researcher source pack", output: "Claim inventory created; checking dates and attributions." },
      { at: 2400, agent: "Researcher", text: "Extracted competitive differentiators", input: "Filtered sources", output: "Differentiator table for synthesis." },
      { at: 2700, agent: "Analyst", text: "Scored options against criteria", input: "Evidence + criteria", output: "Preliminary ranking complete." },
      { at: 3100, agent: "Fact-checker", text: "Confirmed no contradictory filings", input: "Claim inventory", output: "No hard contradictions in public sources reviewed." },
      { at: 3600, agent: "Synthesizer", text: "Composing executive summary", input: "All lane outputs", output: "Outline locked; writing recommendation." },
      { at: 4300, agent: "Synthesizer", text: "Finalized report & source map", input: "Draft + provenance", output: "Report ready." }
    ];
    const totalMs = 4800;
    const ACTIVE_WINDOW = 950;

    session._agentLastAt = {};
    session._lastAgent = null;
    session._progress = 0;
    session._finishing = false;
    AGENTS.forEach((a) => { session._laneState[a] = "waiting"; });

    let i = 0;
    const start = Date.now();

    function recomputeStates(elapsed) {
      session._laneState = recomputeLaneStates(session, elapsed, {
        activeWindow: ACTIVE_WINDOW,
        agents: AGENTS,
        scriptRemaining: script.length - i
      });
    }

    function paint(forceFull) {
      if (activeId === session.id && view === "trace" && !composeMode) {
        renderTopbar();
        renderSidebar();
        renderTransport();
        const root = $("#content");
        const canPatch = !forceFull && root.querySelector('[data-od-id="trace-view"]');
        if (canPatch && patchTrace(session)) {
          return;
        }
        root.innerHTML = renderTrace(session);
        wireTrace(session);
      } else {
        renderSidebar();
        renderTopbar();
      }
    }

    function finishRun() {
      clearInterval(runTimer);
      runTimer = null;
      AGENTS.forEach((a) => { session._laneState[a] = "complete"; });
      session._progress = 100;
      session._finishing = true;
      session.state = "complete";
      session.duration = Math.round((Date.now() - start) / 1000) + "s";
      session.report = buildLiveReport(session);
      paint();

      session._finishTimer = setTimeout(() => {
        session._finishing = false;
        session._finishTimer = null;
        if (activeId === session.id && !composeMode) {
          view = "report";
          render();
          showToast("Report ready");
        }
      }, 780);
    }

    function tick() {
      const elapsed = Date.now() - start;
      session.duration = Math.round(elapsed / 1000) + "s";
      session._progress = Math.min(99, Math.round((elapsed / totalMs) * 100));

      while (i < script.length && script[i].at <= elapsed) {
        const step = script[i++];
        const t = new Date();
        const ts = t.toTimeString().slice(0, 8);
        session.lanes[step.agent].push({
          t: ts,
          text: step.text,
          input: step.input,
          output: step.output,
          _at: Date.now()
        });
        session._agentLastAt[step.agent] = elapsed;
        session._lastAgent = step.agent;
      }

      recomputeStates(elapsed);

      if (i >= script.length && elapsed > totalMs) {
        finishRun();
        return;
      }

      paint();
    }

    runTimer = setInterval(tick, 160);
    tick();
  }

  function buildLiveReport(session) {
    const q = escapeHtml(session.query);
    const shortTitle = truncate(session.query, 64);
    return {
      title: shortTitle,
      eyebrow: "DEMO · Multitrack live run",
      html: `
        <p>Multi-agent research run completed for the query below. Analyst, Researcher, Fact-checker, and Synthesizer produced a structured diligence starter — not a substitute for vendor NDA materials or a formal RFP scorecard.</p>
        <div class="callout"><strong>Query:</strong> ${q}</div>

        <h2>Executive summary</h2>
        <p>The graph framed decision criteria, assembled a ranked public-source pack, validated primary claims for hard contradictions, and synthesized a recommendation narrative. <strong>Use this as the first-pass brief</strong> before commercial negotiation or technical pilot design.</p>
        <div class="callout"><strong>Working recommendation:</strong> Prioritize options that clear identity, data-residency, and evidence-export bars in the first 30 days; defer pure feature breadth until those gates pass.</div>

        <h2>Decision frame (Analyst)</h2>
        <table>
          <thead><tr><th>Criterion</th><th>Weight</th><th>What was scored</th></tr></thead>
          <tbody>
            <tr><td>Fit to stated constraints</td><td>30%</td><td>Direct match to query objectives and hard requirements</td></tr>
            <tr><td>Evidence quality</td><td>25%</td><td>Primary docs, trust centers, public filings</td></tr>
            <tr><td>Risk / lock-in</td><td>20%</td><td>Commercial, operational, and exit exposure</td></tr>
            <tr><td>Time-to-value</td><td>15%</td><td>Pilotability within ~90 days</td></tr>
            <tr><td>Ops burden</td><td>10%</td><td>Ongoing integration and staffing load</td></tr>
          </tbody>
        </table>

        <h2>Lane contributions</h2>
        <ul>
          <li><strong>Analyst:</strong> Parsed objectives, weighted criteria, and preliminary option scoring.</li>
          <li><strong>Researcher:</strong> Retrieval fan-out, relevance ranking, and differentiator extraction.</li>
          <li><strong>Fact-checker:</strong> Claim inventory against public materials; no hard contradictions in the sampled set.</li>
          <li><strong>Synthesizer:</strong> Executive narrative, residual risks, and follow-up actions with source map.</li>
        </ul>

        <h2>Residual risks</h2>
        <ul>
          <li><strong>Public-source bias:</strong> Marketing pages and blogs over-index on strengths; treat capability claims as provisional until demo or sandbox proof.</li>
          <li><strong>Commercial opacity:</strong> List pricing rarely matches enterprise quotes — model TCO with procurement, not the public calculator alone.</li>
          <li><strong>Integration debt:</strong> Identity, SIEM, and data-plane connectors often dominate schedule risk over core product fit.</li>
        </ul>

        <h2>Recommended next steps</h2>
        <ul>
          <li>Request vendor DPAs, subprocessors, and latest SOC 2 / ISO packs under NDA.</li>
          <li>Run a 2-week technical pilot against production-like accounts with success metrics written before kickoff.</li>
          <li>Model 3-year TCO including implementation, platform fees, and ops headcount.</li>
          <li>Re-run Fact-checker after any regulatory or acquisition news material to the shortlist.</li>
        </ul>
      `,
      sources: [
        { id: "live1", title: "Primary retrieval pack (session)", url: "https://example.com/research/" + session.id, agents: ["Researcher", "Fact-checker"] },
        { id: "live2", title: "Analyst criteria worksheet", url: "https://example.com/criteria/" + session.id, agents: ["Analyst"] },
        { id: "live3", title: "Claim inventory (Fact-checker)", url: "https://example.com/claims/" + session.id, agents: ["Fact-checker"] },
        { id: "live4", title: "Synthesizer outline & recommendation", url: "https://example.com/outline/" + session.id, agents: ["Synthesizer", "Analyst"] },
        { id: "live5", title: "Risk & lock-in notes", url: "https://example.com/risks/" + session.id, agents: ["Analyst", "Synthesizer"] }
      ]
    };
  }

  function openCancelModal() {
    const s = activeSession();
    if (!s || s.state !== "running") return;
    lastFocusEl = document.activeElement;
    const modal = $("#cancel-modal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus($("#cancel-modal .modal") || modal);
    $("#cancel-modal-confirm").focus();
  }

  function closeCancelModal() {
    const modal = $("#cancel-modal");
    if (!modal.classList.contains("open")) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (lastFocusEl && typeof lastFocusEl.focus === "function") {
      try { lastFocusEl.focus(); } catch (_) { /* ignore */ }
    }
    lastFocusEl = null;
  }

  function cancelRun() {
    const s = activeSession();
    if (!s || (s.state !== "running" && !s._finishing)) return;
    closeCancelModal();
    clearInterval(runTimer);
    runTimer = null;
    if (s._finishTimer) {
      clearTimeout(s._finishTimer);
      s._finishTimer = null;
    }
    s._finishing = false;
    s.state = "cancelled";
    s.duration = Math.round((Date.now() - (s._start || Date.now())) / 1000) + "s";
    AGENTS.forEach((a) => {
      if (s._laneState[a] === "active" || s._laneState[a] === "waiting") {
        if (s.lanes[a].length) s._laneState[a] = "complete";
        else s._laneState[a] = "waiting";
      }
    });
    AGENTS.forEach((a) => {
      if (s.lanes[a].length) {
        s.lanes[a].push({
          t: new Date().toTimeString().slice(0, 8),
          text: "Run cancelled by user",
          input: "Stop control",
          output: "Lane halted; no further actions.",
          error: false
        });
      }
    });
    s.report = null;
    view = "trace";
    render();
    showToast("Take stopped — no report generated", { variant: "destructive", duration: 3800 });
  }

  /* ─── master render ───────────────────────────────────────────── */
  function render() {
    renderSidebar();
    renderTopbar();
    renderContent();
    renderTransport();
  }

  /* ─── events ──────────────────────────────────────────────────── */
  $("#btn-new-research").addEventListener("click", () => {
    composeMode = true;
    view = "compose";
    setSidebarOpen(false);
    render();
  });

  $("#session-list").addEventListener("click", (e) => {
    const item = e.target.closest(".session-item");
    if (!item) return;
    activeId = item.dataset.id;
    composeMode = false;
    // Graph-first: finished takes open Stages; Report is one tab away.
    view = "trace";
    setSidebarOpen(false);
    render();
  });


  $("#session-filter").addEventListener("input", renderSidebar);

  $("#view-tabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab || tab.disabled) return;
    view = tab.dataset.view;
    render();
  });

  $("#menu-toggle").addEventListener("click", () => setSidebarOpen(!sidebarOpen));
  $("#sidebar-scrim").addEventListener("click", () => setSidebarOpen(false));
  window.addEventListener("resize", () => {
    if (window.innerWidth > 860 && sidebarOpen) setSidebarOpen(false);
  });

  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  $("#source-modal-close").addEventListener("click", closeSourceModal);
  $("#source-modal").addEventListener("click", (e) => {
    if (e.target === $("#source-modal")) closeSourceModal();
  });
  $("#cancel-modal-keep").addEventListener("click", closeCancelModal);
  $("#cancel-modal-confirm").addEventListener("click", cancelRun);
  $("#cancel-modal").addEventListener("click", (e) => {
    if (e.target === $("#cancel-modal")) closeCancelModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("#drawer").classList.contains("open")) closeDrawer();
      else if ($("#cancel-modal").classList.contains("open")) closeCancelModal();
      else if ($("#source-modal").classList.contains("open")) closeSourceModal();
      else if (sidebarOpen) setSidebarOpen(false);
    }
  });

  /* ─── utils ───────────────────────────────────────────────────── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }
  function truncate(str, n) {
    if (!str) return "";
    return str.length > n ? str.slice(0, n - 1) + "…" : str;
  }
  function slugify(str) {
    return String(str)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 60) || "report";
  }

  /* Expose pure helpers for tests (no Node require of the page). */
  window.__ResearchUI = {
    AGENTS,
    AGENT_CODES,
    stateLabel,
    recomputeLaneStates,
    countActiveLanes,
    traceHintText,
    escapeHtml,
    escapeAttr,
    truncate,
    slugify,
    reportToMarkdown
  };

  /* ─── init: graph-first Stages for demo walkthrough ──────── */
  activeId = "s1";
  composeMode = false;
  view = "trace";
  render();
})();
  </script>
</body>
